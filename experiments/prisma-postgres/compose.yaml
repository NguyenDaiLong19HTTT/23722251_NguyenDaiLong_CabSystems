# Run only through run.mjs: new unique project, loopback port, tmpfs, owned secrets.
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    profiles: ["test"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    secrets: [postgres_password]
    ports: ["127.0.0.1::5432"]
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
secrets:
  postgres_password:
    file: ${CAB_PROBE_SECRET_DIR:?runner creates a private experiment directory}/postgres_password
