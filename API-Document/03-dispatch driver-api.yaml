openapi: 3.0.3

info:
  title: CAB System - Dispatch & Driver Trip Requests API
  version: "1.3.0"
  description: |
    Đặc tả điều phối, tra cứu tài xế gần vị trí và phản hồi lời mời
    theo bản SRS 8 MS phiên bản 1.3 và Micro_Service_Design phiên bản 1.3.
    Kế thừa API 1.2.0; đây là bản xem trước cần duyệt trước khi áp dụng.
    Giữ endpoint người dùng và enum nghiệp vụ; thêm 202/tiến trình nhận chuyến.
    POST nội bộ /bookings/{bookingId}/dispatch được chuyển thành ca sử dụng
    startDispatch của Booking, mô tả ở x-internal-workflows; không còn route HTTP.
    Hợp đồng .proto, danh tính dịch vụ và các API 02/04/07 cần đồng bộ riêng.

    Truy xuất yêu cầu:
    - BR01, BR02, BR09.
    - FR04, FR05, FR06, FR07, FR24.
    - BRu01 đến BRu04, BRu09, BRu19, BRu20, BRu27.
    - UC03, UC05, UC18.
    - AC03, AC09, AC10, AC16, AC20.
    - NFR02, NFR03, NFR04, NFR11, NFR12, NFR17.
    - FR28, UC22, AC21, NFR18: theo dõi và phục hồi phân công.

    Phân biệt:
    - Nearby search: tra cứu tài xế tại thời điểm tìm kiếm.
    - DispatchProcess: tiến trình điều phối của một Booking.
    - TripRequest: lời mời gửi đến một tài xế.
    - Trip: chuyến thực tế sau khi phân công thành công.

    Quy tắc:
    - Tra cứu nearby không tạo Booking, lời mời hoặc giữ chỗ tài xế.
    - Một Booking có tối đa một DispatchProcess.
    - Một Booking có tối đa một TripRequest PENDING tại một thời điểm.
    - Một Booking có tối đa một Trip.
    - Một tài xế có tối đa một Trip đang hoạt động.
    - Không gửi lại cùng tài xế trong cùng DispatchProcess.
    - Một tài xế có thể nhận lời mời từ nhiều Booking khi còn AVAILABLE,
      nhưng chỉ được nhận thành công một Trip đang hoạt động.

    Điều kiện ứng viên:
    - Account ACTIVE.
    - Driver.approvalStatus APPROVED.
    - Driver.driverStatus AVAILABLE.
    - Có VehicleAssignment hiện hành hợp lệ.
    - Vehicle ACTIVE.
    - Loại xe phù hợp với Booking khi điều phối.
    - Driver và Vehicle không bị reservation giữ hoặc gắn Trip đang hoạt động,
      bao gồm ERROR chưa đóng; trạng thái AVAILABLE một mình không đủ.
    - Vị trí hợp lệ, còn mới và nằm trong bán kính yêu cầu.

    Tài xế chưa được duyệt có thể đăng nhập theo Authentication API,
    nhưng không được trở thành ứng viên hoặc nhận chuyến.

    Khoảng cách:
    - Dùng khoảng cách địa lý giữa tọa độ tìm kiếm/điểm đón và vị trí tài xế.
    - Đây không phải quãng đường tuyến xe chạy hoặc quãng đường tính cước.
    - Xếp theo khoảng cách chưa làm tròn tăng dần.
    - Khi bằng nhau, dùng driverId làm thứ tự phụ ổn định.

    Hai phạm vi khác nhau:
    - Nearby: mặc định 1 km để đáp ứng tiêu chí 13.
    - Điều phối Booking: đề xuất 5 km.
    - Thay radiusKm của nearby không thay đổi cấu hình DispatchProcess.

    Thông số điều phối được chụp lại khi bắt đầu:
    - Bán kính: 5 km.
    - Thời hạn lời mời: 30 giây.
    - Tối đa 5 lời mời, gồm lời mời đầu tiên.
    - Tổng thời gian tìm: tối đa 180 giây.
    - Tuổi vị trí tối đa: 30 giây.

    Các giá trị trên là cấu hình đề xuất.
    Client không được tự gửi cấu hình điều phối.

    Thời hạn do máy chủ kiểm tra.
    Không dựa vào đồng hồ giao diện hoặc việc Redis đã xóa key TTL hay chưa.
    Nhận lại GPS cũ không được làm vị trí đó trở thành vị trí mới.
    Quy tắc kiểm tra timestamp GPS phải thống nhất với Trip API.

    Kiến trúc:
    - Driver & Fleet sở hữu Driver, Vehicle, VehicleAssignment, DriverLocation
      và DriverReservation; phục vụ /drivers/nearby.
    - Booking & Dispatch sở hữu DispatchProcess, TripRequest và AssignmentSaga;
      phục vụ trạng thái điều phối, danh sách/chi tiết/accept/reject lời mời.
    - Trip sở hữu TripPreparation, chuyến hoạt động và lịch sử.
    - Customer sở hữu ActivityGuard; Identity sở hữu Account/Session.
    - Accept là tiến trình nhiều transaction cục bộ, không có transaction xuyên DB.
    - Gateway chuyển REST sang gRPC; dịch vụ không truy cập database của nhau.
    - Booking là coordinator quyết định tranh chấp accept/cancel/reject/expire.
    - x-owner-service chỉ ghi trách nhiệm thiết kế, không tự cấu hình routing.
    - Công việc nền, kết quả lời mời và deadline được lưu bền vững.
    - Outbox được ghi cùng transaction nghiệp vụ.
    - Worker phát sự kiện qua RabbitMQ sau commit.
    - Lỗi Notification không đảo ngược phân công đã thành công.
    - HTTP request từ client đi qua Gateway.
    - Worker trong Booking gọi ca sử dụng startDispatch qua công việc bền vững;
      không mở REST khởi tạo điều phối tại Gateway hay cổng CAB Core riêng.
    - Lời gọi sang Driver/Customer/Trip/Identity dùng gRPC có service identity,
      quyền tối thiểu, operationId, deadline và version/generation.
    - D04 phải chốt .proto và metadata xác thực; không dùng user JWT thay service identity.
    - RabbitMQ phục vụ sự kiện sau commit; không coi message đã gửi là bằng chứng
      MS nhận đã xác nhận giữ/giải phóng tài nguyên.

    Bảo mật:
    - Kiểm tra chữ ký JWT, issuer, audience, thời hạn, Account và Session.
    - Kiểm tra role và quyền trên từng đối tượng.
    - Sai role trả 403.
    - Đối tượng không tồn tại hoặc ngoài phạm vi người gọi trả 404.
    - Service token và user token không thay thế nhau.
    - Phản hồi dùng Cache-Control: no-store.
    - Không ghi token hoặc vị trí đầy đủ vào log nếu không cần thiết.
    - Giới hạn request tại Gateway; vượt giới hạn trả 429.
    - Sử dụng HTTPS ngoài môi trường phát triển cục bộ.

    Đây là tài liệu thiết kế, chưa xác nhận dịch vụ đã triển khai
    hoặc vượt qua kiểm thử.

servers:
  - url: /v1
    description: |
      Đường dẫn cơ sở trên API Gateway cho endpoint người dùng.
      Mọi path trong tài liệu này là REST qua Gateway; không có server CAB Core nội bộ.

tags:
  - name: DriverDiscovery
    description: Tra cứu tài xế gần vị trí.
  - name: Dispatch
    description: Tiến trình tìm và phân công tài xế.
  - name: DriverTripRequest
    description: Lời mời nhận chuyến của tài xế.

security:
  - bearerAuth: []

x-internal-workflows:
  startDispatch:
    owner: booking-service
    formerOperationId: startDispatch
    formerHttpPath: POST /bookings/{bookingId}/dispatch
    transport: LOCAL_USE_CASE
    description: >-
      Worker của Booking nhận công việc bền vững từ transaction tạo Booking. Không có REST khởi tạo
      điều phối trong bản 8 MS; x-internal-workflows chỉ là đặc tả thiết kế, không thực thi bảo mật
      hay thay .proto.

      bookingId là khóa duy nhất, Booking và DispatchProcess cùng cab_booking. Worker chuyển PENDING
      sang FINDING_DRIVER và tạo DispatchProcess/configSnapshot cùng transaction hoặc hoàn tất tiến
      trình đã có; không để hai worker tạo hai tiến trình. startedAt ghi một lần khi chuyển
      FINDING_DRIVER, deadlineAt = startedAt + maxSearchSeconds. Replay đọc lại tiến trình, không
      reset thời hạn/attemptCount/attemptedDriverIds.

      Trước phát offer, kiểm tra không có quyết định hủy hoặc AssignmentSaga đang xử lý. Lấy ứng
      viên qua gRPC Driver, xác minh hiện trạng; tạo TripRequest PENDING, tăng attemptCount, ghi
      outbox cùng transaction Booking. Chỉ một offer PENDING cho Booking; expiresAt không vượt
      deadlineAt.

      Reject/expire được coordinator chốt có điều kiện rồi mới tìm ứng viên chưa mời. Không retry
      ứng viên mới khi phân công cũ chưa rõ. Lệnh đến muộn không gia hạn deadline.

      Kết thúc không phân công: đối soát chắc chắn chưa có Trip hoạt động, bù TripPreparation nếu
      có, giải phóng đúng reservation và Customer guard bằng version/generation, sau đó commit
      NO_DRIVER_AVAILABLE/Booking NO_DRIVER_FOUND và outbox. Hủy thắng dùng kết quả CANCELLED theo
      API 02. Không giải phóng tài nguyên chuyến khác.

      Lỗi gRPC/broker không được biến thành NO_ELIGIBLE_DRIVER. Ghi tiến trình phục hồi và cảnh báo;
      worker restart tiếp tục cùng operation. RabbitMQ phát outbox sau commit.

      Nếu tách worker thành process/container, vẫn thuộc Booking MS, dùng queue nội bộ được phân
      quyền. Chỉ bổ sung gRPC startDispatch khi có bên gọi khác thực sự cần; phải chốt .proto/scope
      theo D04.

paths:
  /drivers/nearby:
    get:
      tags: [DriverDiscovery]
      operationId: searchNearbyDrivers
      x-owner-service: driver-service
      summary: Tra cứu tài xế đủ điều kiện gần một tọa độ
      description: |
        FR24, UC18, BRu27, AC16.
        Đáp ứng tiêu chí 13 của rubric.

        Quyền:
        - CUSTOMER có Account ACTIVE và Session hợp lệ.
        - OPERATOR có quyền tra cứu vận hành.
        - DRIVER không dùng endpoint này để xem tài xế khác.

        Không nhận customerId, driverId hoặc danh sách ứng viên từ client.
        Query parameter ngoài danh sách được định nghĩa bị từ chối.

        radiusKm mặc định 1.
        Phạm vi hỗ trợ đề xuất của API này là lớn hơn 0 và tối đa 5 km.
        Đây là giới hạn tra cứu của bản API, không phải thông số do rubric quy định.

        Trang đầu:
        - Kiểm tra tọa độ, bán kính, limit và quyền.
        - Driver đọc dữ liệu Fleet/vị trí của mình và xác minh Account qua Identity.
        - Đóng băng tập kết quả thu thập tại snapshotAt; không tuyên bố snapshot
          transaction chung giữa DB Identity và Driver.
        - Lọc theo điều kiện Account, hồ sơ, hoạt động, xe và GPS.
        - Chỉ giữ ứng viên có khoảng cách chưa làm tròn không vượt radiusKm.
        - Sắp xếp khoảng cách tăng dần, sau đó driverId.
        - Lưu kết quả tìm kiếm có thời hạn để phục vụ phân trang.

        Endpoint không nhận loại dịch vụ, nên có thể trả nhiều vehicleType.
        Điều phối Booking sẽ lọc thêm loại xe theo Booking.

        Bảo vệ dữ liệu:
        - Chỉ trả driverId, vehicleType và khoảng cách gần đúng.
        - Không trả email, phone, giấy phép, biển số hoặc tọa độ chính xác.
        - distanceMeters được làm tròn xuống theo bước 10 mét để hiển thị.
        - Kiểm tra bán kính và sắp xếp dùng khoảng cách nội bộ chưa làm tròn.

        Phân trang:
        - Trang đầu không gửi cursor.
        - Trang sau gửi nguyên nextCursor.
        - Giữ nguyên latitude, longitude, radiusKm và limit.
        - Cursor gắn với Account, bộ tham số và kết quả tìm kiếm.
        - Cursor không được dùng để truy cập kết quả của Account khác.
        - Cursor sai hoặc tham số không khớp trả 400 INVALID_CURSOR.
        - Cursor hết hạn trả 400 CURSOR_EXPIRED.
        - Kết quả tìm kiếm không được thay nội dung hoặc sắp xếp lại giữa các trang.
        - hasMore=false thì không trả nextCursor.

        Đề xuất kết quả tìm kiếm hiệu lực tối đa 30 giây từ snapshotAt.
        Thời hạn thực tế được trả bằng expiresAt.
        Mất dữ liệu snapshot không được âm thầm tạo kết quả mới dưới cursor cũ;
        client phải bắt đầu lại từ trang đầu.

        Mọi trang giữ cùng kết quả đã quan sát trong lần thu thập kết thúc tại
        snapshotAt; đây không phải cam kết đồng thời tuyệt đối giữa các MS hoặc
        tài xế vẫn AVAILABLE/GPS vẫn mới ở thời điểm đọc trang sau.
        Trước đóng băng phải loại GPS quá tuổi cho phép tại snapshotAt.
        Không xác minh được điều kiện bắt buộc thì trả 503, không mặc định đủ điều kiện.
        Khi nhận chuyến phải xác minh hiện trạng và giữ tài nguyên tại Driver MS.
        Giao diện phải dùng snapshotAt để thể hiện thời điểm tra cứu.

        Muốn có tình trạng mới nhất thì bắt đầu tìm kiếm mới, không dùng cursor cũ.
        Khi phát hành lời mời và accept vẫn phải kiểm tra lại điều kiện hiện tại.

        Không có ứng viên trả 200 với items=[].
        Không trả khoảng cách giả bằng 0 khi không có dữ liệu.

        Dữ liệu demo:
        - Ít nhất năm tài xế có trạng thái/điều kiện khác nhau.
        - Ít nhất hai người đủ điều kiện trong 1 km để thử phân trang.
        - Có người ngoài bán kính, OFFLINE/BUSY, chưa duyệt hoặc GPS cũ.
      parameters:
        - name: latitude
          in: query
          required: true
          description: Vĩ độ điểm tìm kiếm.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          description: Kinh độ điểm tìm kiếm.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: radiusKm
          in: query
          required: false
          description: |
            Bán kính tra cứu theo km.
            Mặc định 1 km; không thay đổi bán kính điều phối Booking.
          schema:
            type: number
            minimum: 0
            exclusiveMinimum: true
            maximum: 5
            default: 1
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: |
            Một trang của kết quả tìm kiếm tại snapshotAt.
            Không tạo hoặc giữ chỗ tài xế.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearbyDriverPage"
        "400":
          description: |
            VALIDATION_ERROR, INVALID_CURSOR hoặc CURSOR_EXPIRED.
            Có thể do tọa độ, bán kính, limit, tham số không được phép,
            cursor không hợp lệ hoặc kết quả tìm kiếm không còn sử dụng được.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /bookings/{bookingId}/dispatch/status:
    get:
      tags: [Dispatch]
      operationId: getDispatchStatus
      x-owner-service: booking-service
      summary: Xem trạng thái điều phối của Booking
      description: |
        FR07, UC03.

        Quyền:
        - CUSTOMER sở hữu Booking.
        - OPERATOR có quyền tra cứu vận hành.

        DRIVER trả 403.

        Kiểm tra quyền đối với Booking trước khi tiết lộ
        việc DispatchProcess đã tồn tại hay chưa.

        Booking không tồn tại hoặc ngoài phạm vi CUSTOMER
        trả 404 BOOKING_NOT_FOUND.

        Booking thuộc quyền nhưng chưa có tiến trình
        trả 404 DISPATCH_NOT_FOUND.
        Điều này không đồng nghĩa Booking không tồn tại.

        Không trả danh sách ứng viên, vị trí hoặc thông tin cá nhân
        của tài xế chưa được phân công.

        DRIVER_FOUND có driverId và tripId.
        Sau đó theo dõi qua Trip API.

        Tiến trình giữ DRIVER_FOUND sau khi Trip hoàn thành hoặc bị hủy.
        Trạng thái thực hiện chuyến không được ghi đè vào kết quả điều phối.
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Trạng thái hiện tại của tiến trình điều phối.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchProcess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            BOOKING_NOT_FOUND hoặc DISPATCH_NOT_FOUND.
            Chỉ trả DISPATCH_NOT_FOUND sau khi xác nhận quyền trên Booking.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /drivers/me/trip-requests:
    get:
      tags: [DriverTripRequest]
      operationId: listMyPendingTripRequests
      x-owner-service: booking-service
      summary: Xem lời mời còn hiệu lực của tài xế đang đăng nhập
      description: |
        FR05, UC05.

        Chỉ DRIVER có Account ACTIVE và Session hợp lệ.
        CUSTOMER và OPERATOR trả 403.

        driverId được xác định từ Account.
        Không nhận driverId khác trong query.
        Query parameter ngoài danh sách bị từ chối.

        Chỉ trả lời mời:
        - Gửi tới tài xế hiện tại.
        - PENDING.
        - Chưa đến expiresAt hoặc deadlineAt.
        - Booking còn FINDING_DRIVER và tiến trình còn SEARCHING.
        - Tài xế còn đủ điều kiện nhận chuyến và không bị reservation khác giữ.
        - Không có AssignmentSaga đang xử lý accept cho lời mời này.

        Tài xế chưa APPROVED hoặc không còn đủ điều kiện
        nhận danh sách rỗng, không được cấp lời mời có thể nhận.

        Sắp xếp sentAt tăng dần, sau đó tripRequestId.

        Cursor gắn với tài xế, limit và thứ tự sắp xếp.
        Giữ nguyên limit khi lấy trang sau.
        Cursor sai trả 400 INVALID_CURSOR.
        Cursor hết hạn trả 400 CURSOR_EXPIRED.

        Danh sách này là dữ liệu tại thời điểm truy vấn từng trang,
        không dùng snapshot cố định như nearby.
        Lời mời có thể hết hiệu lực giữa hai lần đọc.

        Kết quả không giữ chỗ hoặc bảo đảm accept thành công.
        Accept phải kiểm tra lại các điều kiện.

        Khi tài xế/xe bị giữ chỗ hoặc trở thành BUSY, các lời mời cạnh tranh
        không được xuất hiện như có thể nhận. Booking xử lý thu hồi bền vững,
        có thể trễ giữa các MS; kiểm tra Driver reservation mới là hàng rào
        ngăn accept trùng, không dựa vào việc mọi event thu hồi đã được nhận.
        Booking xác minh điều kiện qua gRPC Driver; không đọc DB Driver.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: |
            Danh sách lời mời còn hiệu lực.
            Không có lời mời thì items=[] và nextCursor=null.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingTripRequestPage"
        "400":
          description: VALIDATION_ERROR, INVALID_CURSOR hoặc CURSOR_EXPIRED.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /trip-requests/{tripRequestId}:
    get:
      tags: [DriverTripRequest]
      operationId: getMyTripRequest
      x-owner-service: booking-service
      summary: Xem chi tiết hoặc kết quả xử lý lời mời
      description: |
        FR05, UC05.

        Chỉ DRIVER được chỉ định trong TripRequest.
        Sai role trả 403.
        Lời mời không tồn tại hoặc thuộc tài xế khác trả 404.

        Cho phép xem ACCEPTED, REJECTED, EXPIRED hoặc CANCELLED
        để xác định kết quả sau khi mất mạng/mất phản hồi.

        Nếu ACCEPTED, trả tripId đã được tạo.

        Không yêu cầu Driver còn AVAILABLE hoặc APPROVED để xem kết quả cũ,
        nhưng Account và Session vẫn phải hợp lệ.

        Không trả lời mời quá hạn hoặc đã mất điều kiện dưới dạng
        PENDING có thể nhận.

        Nếu AssignmentSaga đã được ghi bền vững và còn xử lý, trả 202 cùng
        operationId/Location, không trả PENDING như lời mời còn nhận được.
        Deadline đi qua không tự đóng EXPIRED một accept đã giành quyền đúng hạn.
        Với lời mời chưa có accept đang chạy, coordinator chốt hết hạn/thu hồi
        bằng cập nhật có điều kiện; GET không được vượt quyền quyết định Saga.
        Không tạo sự kiện đóng lặp. Không xác minh được trạng thái bền vững thì
        trả 503, không dựng ACCEPTED/CANCELLED/EXPIRED từ cache hoặc timeout.
      parameters:
        - $ref: "#/components/parameters/TripRequestId"
      responses:
        "200":
          description: Chi tiết và trạng thái hiện tại của lời mời.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripRequest"
        "202":
          description: AssignmentSaga đã ghi bền vững nhưng chưa hoàn tất. Chưa xác nhận nhận chuyến thành
            công; tra cứu Location hoặc replay accept cùng tripRequestId.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              description: URL tiến trình qua Gateway; vẫn yêu cầu đúng Driver và Session hợp lệ.
              schema:
                type: string
              example: /v1/dispatch-operations/ASG_example
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AssignmentOperation"
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - PROCESSING
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TripRequestNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /trip-requests/{tripRequestId}/accept:
    post:
      tags: [DriverTripRequest]
      operationId: acceptTripRequest
      x-owner-service: booking-service
      summary: Chấp nhận lời mời và xác nhận phân công
      description: |
        FR05, BRu01 đến BRu04, UC05, AC03.

        Chỉ DRIVER được chỉ định trong TripRequest.
        Sai role trả 403.
        Lời mời không tồn tại hoặc của người khác trả 404.

        Endpoint không có request body.
        Không nhận driverId, customerId, vehicleId hoặc tripId từ client.
        Không yêu cầu Idempotency-Key; dùng tripRequestId làm khóa tự nhiên.

        Xác thực và kiểm tra quyền trước khi xét replay.
        AssignmentSaga đã FAILED trả lại lỗi cuối đã lưu, không tạo Saga mới
        cho cùng tripRequestId; giữ bằng chứng để chặn lệnh kích hoạt đến muộn.

        Nếu đã ACCEPTED bởi tài xế này:
        - Trả lại kết quả ACCEPTED đã lưu.
        - Không yêu cầu Driver hiện còn AVAILABLE.
        - Không tạo Trip, lịch sử hoặc outbox mới.
        - Không đặt Driver về BUSY nếu Trip cũ đã kết thúc.
        - Không thay đổi trạng thái của Trip mới mà tài xế đang thực hiện.

        Khi nhận mới, Booking xác minh điều kiện và giành quyền bằng cập nhật
        có điều kiện/version trên bản ghi quyết định tại cab_booking:
        - Lưu AssignmentSaga bền vững, assignmentId và tripId ổn định cho lời mời.
        - Accept/reject/cancel/expire dùng cùng cơ chế phân xử; không chỉ đọc status.
        - Kiểm tra lại Account/Session và quyền.
        - TripRequest phải PENDING.
        - Thời gian máy chủ phải nhỏ hơn expiresAt và deadlineAt.
        - Booking phải FINDING_DRIVER.
        - DispatchProcess phải SEARCHING.
        - Driver phải APPROVED và AVAILABLE.
        - Xe ACTIVE, phân công hiện hành hợp lệ, đúng loại dịch vụ.
        - GPS còn hợp lệ, mới và nằm trong bán kính điều phối.
        - Driver và Vehicle không có reservation khác hoặc Trip đang hoạt động.
        - Trip ERROR chưa đóng vẫn được tính là đang hoạt động.

        Phối hợp theo AssignmentSaga:
        - Driver xác minh điều kiện hiện tại rồi giữ nguyên tử Driver và Vehicle
          trong DB của mình; trả reservationId/generation cho đúng assignmentId.
        - Trip tạo TripPreparation idempotently, unique bookingId/assignmentId;
          chưa công bố chuyến hoạt động hay trả tripId như phân công thành công.
        - Customer chuyển guard đúng Booking/operation sang tripId bằng version.
        - Driver xác nhận reservation cho tripId, cập nhật trạng thái theo quy tắc.
        - Trip chỉ kích hoạt khi đủ xác nhận; quyền đã xác nhận không tự hết hạn.
        - Booking xác nhận Trip hoạt động rồi commit TripRequest ACCEPTED,
          Booking DRIVER_ASSIGNED, DispatchProcess DRIVER_FOUND, kết quả, audit
          và outbox trong cab_booking. Các MS ghi lịch sử của mình tại DB riêng.
        - Thu hồi offer cạnh tranh và tiếp tục Booking khác bằng công việc bền vững;
          kiểm tra reservation ngăn nhận trùng ngay cả khi thu hồi chưa đến.

        Chỉ trả 200 khi tất cả điều kiện phân công đã xác nhận và kết quả đã commit.
        Nếu operation bền vững chưa hoàn tất, trả 202 để theo dõi, chưa trả tripId.
        Retry cùng tripRequestId dùng cùng Saga, không tạo assignment/trip thứ hai.

        Nếu lỗi trước kích hoạt, hủy TripPreparation với tombstone/version trước
        khi giải phóng đúng reservation/generation. Customer guard phải trở lại
        quyền Booking khi tiếp tục tìm; chỉ giải phóng khi Booking kết thúc/hủy.
        Chưa rõ Trip đã kích hoạt thì tra cứu trước khi bù. Đã kích hoạt phải phục hồi
        về phía trước, không xóa Trip hoặc giải phóng tài nguyên như chưa nhận chuyến.
        Bù chưa xong thì chưa chuyển sang ứng viên kế tiếp hoặc báo thất bại cuối.
        Lease/TTL hết chỉ cho worker mới tiếp quản, không tự giải phóng tài nguyên.

        Chuyển OFFLINE/đổi xe/reserve dùng kiểm tra nhất quán tại Driver DB;
        hủy Booking/reject/accept dùng bản ghi quyết định tại Booking DB.
        Identity được xác minh qua gRPC trước bước nhạy cảm, không dùng snapshot
        nearby hoặc cache cũ thay thế. Account lock cạnh tranh với lệnh đã được
        cấp quyền là quyết định D07 còn phải chốt; không hứa atomic xuyên hai DB.

        expiresAt/deadlineAt giới hạn thời điểm giành quyền accept mới.
        Nếu đã giành quyền bền vững đúng hạn, quá hạn sau đó vẫn phục hồi cùng Saga,
        không đổi sang EXPIRED chỉ vì hết giờ. Không gia hạn offer hay phát offer mới
        trong khi kết quả phân công cũ chưa rõ. Deadline phục hồi/giám sát tách khỏi
        deadline tìm kiếm; quá ngưỡng phải cảnh báo và đối soát có kiểm soát.

        Tranh chấp:
        - Hai Booking không cùng giành được một tài xế.
        - Hủy Booking và accept không cùng thành công.
        - Hủy thắng thì accept bị từ chối.
        - Accept thắng thì hủy Booking bị từ chối;
          hủy sau đó phải qua Trip API.

        Nếu request khác đang xử lý accept cùng lời mời,
        trả 202 cùng operationId và Location tra cứu.
        Không tạo lần phân công thứ hai.

        Nếu mất phản hồi hoặc lỗi tạm thời:
        - Tra cứu hoặc gửi lại cùng tripRequestId.
        - Không suy đoán thất bại chỉ vì chưa nhận response.
        - Không trả thành công giả.
        - Lỗi Notification sau commit không đảo ngược phân công.
      parameters:
        - $ref: "#/components/parameters/TripRequestId"
      responses:
        "200":
          description: Phân công thành công hoặc replay kết quả ACCEPTED đã lưu.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedTripRequest"
        "202":
          description: AssignmentSaga đã ghi bền vững nhưng chưa hoàn tất. Chưa xác nhận nhận chuyến thành
            công; tra cứu Location hoặc replay accept cùng tripRequestId.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              description: URL tiến trình qua Gateway; vẫn yêu cầu đúng Driver và Session hợp lệ.
              schema:
                type: string
              example: /v1/dispatch-operations/ASG_example
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AssignmentOperation"
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - PROCESSING
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TripRequestNotFound"
        "409":
          description: |
            Một trong các mã:
            - TRIP_REQUEST_EXPIRED.
            - TRIP_REQUEST_CANCELLED.
            - TRIP_REQUEST_ALREADY_REJECTED.
            - BOOKING_NOT_ASSIGNABLE.
            - DRIVER_NOT_AVAILABLE.
            - DRIVER_NOT_ELIGIBLE.
            - VEHICLE_NOT_AVAILABLE.

            Không tạo thêm Trip khi có xung đột.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /trip-requests/{tripRequestId}/reject:
    post:
      tags: [DriverTripRequest]
      operationId: rejectTripRequest
      x-owner-service: booking-service
      summary: Từ chối lời mời nhận chuyến
      description: |
        FR05, FR06, UC05.

        Chỉ DRIVER được chỉ định trong TripRequest.
        Sai role trả 403.
        Lời mời không tồn tại hoặc của tài xế khác trả 404.

        Không yêu cầu Idempotency-Key; dùng tripRequestId làm khóa tự nhiên.

        Sau xác thực quyền và kiểm tra cấu trúc request,
        nếu lời mời đã REJECTED:
        - Trả 200 với kết quả đã lưu.
        - Không ghi đè lý do hoặc thời điểm phản hồi.
        - Không tạo thêm công việc điều phối hoặc sự kiện.
        - Không yêu cầu tài xế còn AVAILABLE để nhận lại kết quả cũ.

        Khi xử lý mới:
        - Lời mời phải PENDING và còn hiệu lực.
        - Booking còn FINDING_DRIVER.
        - DispatchProcess còn SEARCHING.
        - Lời mời chưa bị thu hồi do tài xế mất điều kiện.
        - Chưa có AssignmentSaga đang chạy; nếu có trả 409 REQUEST_IN_PROGRESS,
          không coi reject là lệnh hủy Saga. Đọc lại lời mời/operation trước khi xử lý tiếp.
        - Ghi REJECTED, resolvedAt và lý do nếu có.
        - Ghi công việc điều phối tiếp và outbox trong cùng transaction cab_booking.
        - Commit trước khi trả thành công.

        Lý do là tùy chọn; bỏ body hoặc gửi object rỗng nếu không có lý do.
        Không chấp nhận null hoặc chuỗi chỉ có khoảng trắng cho reason.

        Nếu đã ACCEPTED, EXPIRED hoặc CANCELLED thì trả 409.
        Không chuyển ngược trạng thái.

        Từ chối lời mời không hủy Trip đã nhận.
        Hủy Trip được thực hiện qua Trip API.
      parameters:
        - $ref: "#/components/parameters/TripRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectTripRequestRequest"
            example:
              reason: "Tôi không thể đến điểm đón."
      responses:
        "200":
          description: Đã từ chối hoặc replay kết quả REJECTED đã lưu.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectedTripRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TripRequestNotFound"
        "409":
          description: |
            TRIP_REQUEST_ALREADY_ACCEPTED,
            TRIP_REQUEST_EXPIRED,
            TRIP_REQUEST_CANCELLED hoặc REQUEST_IN_PROGRESS.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /dispatch-operations/{operationId}:
    get:
      tags:
        - DriverTripRequest
      operationId: getMyAssignmentOperation
      x-owner-service: booking-service
      summary: Theo dõi kết quả nhận chuyến của tài xế
      description: >-
        FR28, UC22, AC21. Chỉ DRIVER sở hữu TripRequest/AssignmentSaga với Account ACTIVE và Session
        hợp lệ. CUSTOMER/OPERATOR trả 403, theo dõi Booking qua API trạng thái điều phối riêng; không
        mở quyền xem dữ liệu lời mời. Sai operation hoặc của Driver khác trả 404 giống nhau. Biết
        operationId không đủ quyền.
  
        Driver đã OFFLINE/BUSY hoặc không còn APPROVED vẫn đọc kết quả cũ nếu Account/Session hợp lệ.
        GET 200 là tra cứu thành công; chỉ status SUCCEEDED kèm result ACCEPTED chứng minh nhận chuyến
        thành công. PROCESSING không chứa tripId/kết quả tạm. FAILED chỉ sau xác nhận không có Trip
        hoạt động và bù bắt buộc đã hoàn tất; chưa rõ giữ PROCESSING.
  
        GET không kích hoạt lại thao tác. Mất phản hồi accept trước khi biết operationId: replay POST
        accept hoặc GET TripRequest để lấy cùng tiến trình. Lưu operation đang xử lý đến khi kết thúc,
        không TTL tự xóa; giữ kết quả/tombstone cùng vòng đời TripRequest và lịch sử phân công để
        chống nhận lần hai. D08 cần chốt chính sách lưu trữ/xóa đồng bộ trước triển khai; không dọn
        key rồi cho nhận lại lời mời cũ. Có deadline cảnh báo/đối soát cho tiến trình bị kẹt.
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Trạng thái tiến trình nhận chuyến được phép đọc.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: ASSIGNMENT_OPERATION_NOT_FOUND. Không tìm thấy tiến trình được phép tra cứu.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/UnexpectedError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        User access token do Authentication API cấp.
        Kiểm tra chữ ký, thuật toán cho phép, issuer, audience,
        thời hạn, Account, Session, role và quyền đối tượng.
        Decode được payload không có nghĩa token hợp lệ.
        Verification token đăng ký tài xế không dùng thay access token.

  parameters:
    BookingId:
      name: bookingId
      in: path
      required: true
      description: Mã Booking.
      schema:
        $ref: "#/components/schemas/Identifier"
      example: "BK0001"

    TripRequestId:
      name: tripRequestId
      in: path
      required: true
      description: Mã lời mời, không phải bookingId hoặc tripId.
      schema:
        $ref: "#/components/schemas/Identifier"
      example: "TREQ0001"

    Limit:
      name: limit
      in: query
      required: false
      description: |
        Số bản ghi tối đa mỗi trang.
        Giữ nguyên giá trị khi dùng cursor.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        nextCursor của trang trước.
        Trang đầu bỏ tham số này.
        Không gửi chuỗi rỗng, tự tạo hoặc chỉnh sửa cursor.
        Cursor được bảo vệ chống sửa và gắn với người gọi.
      schema:
        type: string
        minLength: 1

  headers:
    NoStore:
      description: Không lưu phản hồi vào bộ nhớ đệm.
      schema:
        type: string
        enum: [no-store]

    RetryAfter:
      description: Số giây tối thiểu chờ trước khi thử lại.
      schema:
        type: integer
        minimum: 1
      example: 30

  schemas:
    Identifier:
      type: string
      minLength: 1
      description: Mã hệ thống cấp; không suy diễn quyền từ cấu trúc mã.

    VehicleType:
      type: string
      enum: [STANDARD, PREMIUM, MOTORBIKE, VAN]

    Location:
      type: object
      additionalProperties: false
      required: [address, latitude, longitude]
      properties:
        address:
          type: string
          minLength: 1
          pattern: '\S'
          description: Văn bản địa chỉ; không phải HTML được phép thực thi.
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    NearbyDriver:
      type: object
      additionalProperties: false
      required: [driverId, vehicleType, distanceMeters]
      properties:
        driverId:
          $ref: "#/components/schemas/Identifier"
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        distanceMeters:
          type: integer
          minimum: 0
          multipleOf: 10
          description: |
            Khoảng cách địa lý tại snapshotAt, làm tròn xuống theo bước 10 mét.
            Không phải quãng đường xe chạy hoặc dữ liệu tính cước.
            Lọc bán kính và sắp xếp dùng khoảng cách chưa làm tròn.
      description: |
        Tài xế được xác minh đủ điều kiện trong lần thu thập kết thúc tại snapshotAt;
        không phải snapshot transaction chung giữa các microservice.
        Không chứa vị trí chính xác, phone, email, giấy phép hoặc biển số.

    NearbyDriverPage:
      type: object
      additionalProperties: false
      required:
        - items
        - radiusKm
        - limit
        - snapshotAt
        - expiresAt
        - hasMore
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/NearbyDriver"
          description: Không vượt limit; các trang dùng cùng tập kết quả.
        radiusKm:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 5
          description: Bán kính đã áp dụng.
        limit:
          type: integer
          minimum: 1
          maximum: 100
        snapshotAt:
          type: string
          format: date-time
          description: Thời điểm đóng băng kết quả đã thu thập và kiểm tra; không phải thời điểm commit chung giữa các DB.
        expiresAt:
          type: string
          format: date-time
          description: |
            Thời điểm kết quả tìm kiếm hết hiệu lực.
            Đề xuất tối đa 30 giây sau snapshotAt.
        hasMore:
          type: boolean
        nextCursor:
          type: string
          minLength: 1
          description: Chỉ có khi hasMore=true.
      oneOf:
        - required: [nextCursor]
          properties:
            hasMore:
              type: boolean
              enum: [true]
            items:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/NearbyDriver"
        - properties:
            hasMore:
              type: boolean
              enum: [false]
          not:
            required: [nextCursor]
      description: |
        Không trả totalCount giả.
        Trang cuối không có nextCursor.
        Account và quyền người gọi vẫn được kiểm tra ở mỗi trang.

    DispatchStatus:
      type: string
      enum: [SEARCHING, DRIVER_FOUND, NO_DRIVER_AVAILABLE, CANCELLED]
      description: |
        SEARCHING: đang điều phối hoặc đang phục hồi phân công/giải phóng;
        không đồng nghĩa được phép phát thêm lời mời khi Saga chưa rõ kết quả.
        DRIVER_FOUND: đã xác nhận Trip hoạt động và commit kết quả phân công.
        NO_DRIVER_AVAILABLE: xác nhận không có phân công đang xử lý/chưa rõ
        kết quả và hoàn tất giải phóng tài nguyên cần thiết trước khi kết thúc.
        CANCELLED: kết thúc do Booking hủy trước phân công.

        Ánh xạ:
        - DRIVER_FOUND tương ứng Booking DRIVER_ASSIGNED.
        - NO_DRIVER_AVAILABLE tương ứng Booking NO_DRIVER_FOUND.
        - CANCELLED tương ứng Booking CANCELLED.

        Không thay thế BookingStatus hoặc TripStatus.

    DispatchConfigSnapshot:
      type: object
      additionalProperties: false
      required:
        - searchRadiusKm
        - offerTimeoutSeconds
        - maxOffers
        - maxSearchSeconds
        - maxLocationAgeSeconds
      properties:
        searchRadiusKm:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 5
        offerTimeoutSeconds:
          type: integer
          minimum: 1
          example: 30
        maxOffers:
          type: integer
          minimum: 1
          example: 5
        maxSearchSeconds:
          type: integer
          minimum: 1
          example: 180
        maxLocationAgeSeconds:
          type: integer
          minimum: 1
          example: 30
      description: |
        Cấu hình không đổi trong suốt tiến trình.
        Client không được tự gán.
        Nearby radiusKm không thay đổi cấu hình này.

    DispatchProcess:
      type: object
      additionalProperties: false
      required:
        - bookingId
        - dispatchStatus
        - attemptCount
        - startedAt
        - deadlineAt
        - configSnapshot
        - updatedAt
      properties:
        bookingId:
          $ref: "#/components/schemas/Identifier"
        dispatchStatus:
          $ref: "#/components/schemas/DispatchStatus"
        attemptCount:
          type: integer
          minimum: 0
          description: |
            Số TripRequest đã phát hành, gồm lời mời đầu tiên.
            Không tăng vì gửi lại message của cùng lời mời.
            Không vượt maxOffers.
        startedAt:
          type: string
          format: date-time
          description: Thời điểm Booking bắt đầu FINDING_DRIVER.
        deadlineAt:
          type: string
          format: date-time
        configSnapshot:
          $ref: "#/components/schemas/DispatchConfigSnapshot"
        driverId:
          $ref: "#/components/schemas/Identifier"
        tripId:
          $ref: "#/components/schemas/Identifier"
        failureReason:
          type: string
          enum:
            - NO_ELIGIBLE_DRIVER
            - OFFER_LIMIT_REACHED
            - SEARCH_TIMEOUT
          description: Không dùng để che lỗi phụ thuộc kỹ thuật.
        endedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      oneOf:
        - properties:
            dispatchStatus:
              type: string
              enum: [SEARCHING]
          not:
            anyOf:
              - required: [driverId]
              - required: [tripId]
              - required: [failureReason]
              - required: [endedAt]
        - required: [driverId, tripId, endedAt]
          properties:
            dispatchStatus:
              type: string
              enum: [DRIVER_FOUND]
          not:
            required: [failureReason]
        - required: [failureReason, endedAt]
          properties:
            dispatchStatus:
              type: string
              enum: [NO_DRIVER_AVAILABLE]
          not:
            anyOf:
              - required: [driverId]
              - required: [tripId]
        - required: [endedAt]
          properties:
            dispatchStatus:
              type: string
              enum: [CANCELLED]
          not:
            anyOf:
              - required: [driverId]
              - required: [tripId]
              - required: [failureReason]
      description: |
        Kết quả và cấu hình được lưu bền vững.
        Trường chưa áp dụng được bỏ, không gửi null.
        Tiến trình kết thúc không được mở lại bằng replay.

    TripRequestStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, EXPIRED, CANCELLED]

    TripRequest:
      type: object
      additionalProperties: false
      required:
        - tripRequestId
        - bookingId
        - driverId
        - pickup
        - destination
        - vehicleType
        - status
        - sentAt
        - expiresAt
      properties:
        tripRequestId:
          $ref: "#/components/schemas/Identifier"
        bookingId:
          $ref: "#/components/schemas/Identifier"
        driverId:
          $ref: "#/components/schemas/Identifier"
        pickup:
          $ref: "#/components/schemas/Location"
        destination:
          $ref: "#/components/schemas/Location"
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        note:
          type: string
          description: Ghi chú đón khách; xử lý như văn bản.
        status:
          $ref: "#/components/schemas/TripRequestStatus"
        sentAt:
          type: string
          format: date-time
          description: |
            Thời điểm máy chủ phát hành lời mời.
            Không phải thời điểm Notification được đọc hoặc SMS được giao.
        expiresAt:
          type: string
          format: date-time
          description: |
            Không vượt sentAt + offerTimeoutSeconds hoặc deadlineAt.

            Khi thời gian hiện tại bằng hoặc vượt expiresAt,
            lời mời không nhận accept mới. Saga đã giành quyền đúng hạn vẫn được
            phục hồi; không chốt EXPIRED chỉ vì xử lý nội bộ kéo dài.

            Đọc lại/gửi lại thông báo không gia hạn.
        resolvedAt:
          type: string
          format: date-time
          description: Thời điểm máy chủ ghi nhận trạng thái kết thúc.
        tripId:
          $ref: "#/components/schemas/Identifier"
        rejectReason:
          type: string
          minLength: 1
          pattern: '\S'
        closureReason:
          type: string
          enum:
            - RESPONSE_TIMEOUT
            - SEARCH_TIMEOUT
            - BOOKING_CANCELLED
            - DRIVER_UNAVAILABLE
            - DISPATCH_FINISHED
      oneOf:
        - properties:
            status:
              type: string
              enum: [PENDING]
          not:
            anyOf:
              - required: [resolvedAt]
              - required: [tripId]
              - required: [rejectReason]
              - required: [closureReason]
        - required: [resolvedAt, tripId]
          properties:
            status:
              type: string
              enum: [ACCEPTED]
          not:
            anyOf:
              - required: [rejectReason]
              - required: [closureReason]
        - required: [resolvedAt]
          properties:
            status:
              type: string
              enum: [REJECTED]
          not:
            anyOf:
              - required: [tripId]
              - required: [closureReason]
        - required: [resolvedAt, closureReason]
          properties:
            status:
              type: string
              enum: [EXPIRED]
            closureReason:
              type: string
              enum: [RESPONSE_TIMEOUT, SEARCH_TIMEOUT]
          not:
            anyOf:
              - required: [tripId]
              - required: [rejectReason]
        - required: [resolvedAt, closureReason]
          properties:
            status:
              type: string
              enum: [CANCELLED]
            closureReason:
              type: string
              enum:
                - BOOKING_CANCELLED
                - DRIVER_UNAVAILABLE
                - DISPATCH_FINISHED
          not:
            anyOf:
              - required: [tripId]
              - required: [rejectReason]
      description: |
        Chỉ trả cho tài xế được chỉ định.
        Không chứa hồ sơ khách hàng đầy đủ hoặc danh sách tài xế cạnh tranh.

        Trường chưa áp dụng được bỏ, không gửi null.
        Lời mời kết thúc không quay lại PENDING.
        ACCEPTED giữ tripId lịch sử kể cả khi Trip đã kết thúc.

    PendingTripRequest:
      allOf:
        - $ref: "#/components/schemas/TripRequest"
        - type: object
          properties:
            status:
              type: string
              enum: [PENDING]

    AcceptedTripRequest:
      allOf:
        - $ref: "#/components/schemas/TripRequest"
        - type: object
          properties:
            status:
              type: string
              enum: [ACCEPTED]

    RejectedTripRequest:
      allOf:
        - $ref: "#/components/schemas/TripRequest"
        - type: object
          properties:
            status:
              type: string
              enum: [REJECTED]

    PendingTripRequestPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PendingTripRequest"
          description: Không vượt limit; chỉ chứa lời mời hiện còn hiệu lực.
        nextCursor:
          type: string
          minLength: 1
          nullable: true
          description: |
            Cursor trang tiếp theo.
            null khi không còn kết quả tại thời điểm truy vấn.
      description: |
        Giữ cấu trúc phân trang lời mời của phiên bản 1.1.
        Lời mời có thể hết hạn trước khi client đọc trang kế tiếp.

    RejectTripRequestRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          pattern: '\S'
          description: |
            Lý do tùy chọn, xử lý như văn bản.
            Nếu không có, bỏ trường hoặc bỏ body.

    AssignmentOperation:
      type: object
      additionalProperties: false
      required:
        - operationId
        - tripRequestId
        - status
        - createdAt
        - updatedAt
      properties:
        operationId:
          type: string
          minLength: 1
          maxLength: 128
        tripRequestId:
          $ref: "#/components/schemas/Identifier"
        status:
          type: string
          enum:
            - PROCESSING
            - SUCCEEDED
            - FAILED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/AcceptedTripRequest"
        error:
          $ref: "#/components/schemas/ErrorResponse"
        failureHttpStatus:
          type: integer
          enum:
            - 409
            - 503
      oneOf:
        - properties:
            status:
              enum:
                - PROCESSING
          not:
            anyOf:
              - required:
                  - result
              - required:
                  - error
              - required:
                  - failureHttpStatus
        - properties:
            status:
              enum:
                - SUCCEEDED
          required:
            - result
          not:
            anyOf:
              - required:
                  - error
              - required:
                  - failureHttpStatus
        - properties:
            status:
              enum:
                - FAILED
          required:
            - error
            - failureHttpStatus
          not:
            required:
              - result
      description: Trạng thái tiến trình riêng, không thêm enum vào TripRequestStatus/DispatchStatus.
        SUCCEEDED chứa kết quả accept 200 đã lưu; FAILED chứa lỗi cuối an toàn sau đối soát/bù. Không
        trả reservationId, generation, lỗi nội bộ hoặc dữ liệu người khác.

    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [errorCode, message]
      properties:
        errorCode:
          type: string
        message:
          type: string
          description: |
            Không chứa token, stack trace, chi tiết database,
            tọa độ hoặc dữ liệu của người không liên quan.
        details:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        correlationId:
          type: string
          description: Mã tham chiếu để kiểm tra lỗi phía máy chủ.

  responses:
    BadRequest:
      description: |
        VALIDATION_ERROR.
        Tham số/body không hợp lệ hoặc chứa trường không được phép.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthenticated:
      description: |
        UNAUTHENTICATED.
        Token thiếu/sai/hết hạn/bị sửa hoặc Session không hợp lệ.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            errorCode: UNAUTHENTICATED
            message: "Phiên đăng nhập không hợp lệ. Vui lòng đăng nhập lại."

    Forbidden:
      description: |
        FORBIDDEN hoặc ACCOUNT_NOT_ACTIVE.
        Đúng danh tính nhưng role không được gọi chức năng
        hoặc Account của người gọi không ACTIVE.

        Đối tượng ngoài phạm vi người gọi dùng 404,
        không trả thông tin chủ sở hữu trong lỗi.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            wrongRole:
              value:
                errorCode: FORBIDDEN
                message: "Bạn không có quyền sử dụng chức năng này."
            inactiveAccount:
              value:
                errorCode: ACCOUNT_NOT_ACTIVE
                message: "Tài khoản hiện không được phép sử dụng chức năng này."

    BookingNotFound:
      description: |
        BOOKING_NOT_FOUND.
        Không tìm thấy Booking trong phạm vi được phép.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            errorCode: BOOKING_NOT_FOUND
            message: "Không tìm thấy yêu cầu đặt xe."

    TripRequestNotFound:
      description: |
        TRIP_REQUEST_NOT_FOUND.
        Lời mời không tồn tại hoặc không thuộc tài xế đang đăng nhập.
        Không phân biệt hai trường hợp trong thông báo.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            errorCode: TRIP_REQUEST_NOT_FOUND
            message: "Không tìm thấy lời mời nhận chuyến."

    TooManyRequests:
      description: |
        RATE_LIMIT_EXCEEDED.
        Vượt giới hạn theo IP, tài khoản hoặc chức năng.

        Chờ Retry-After trước khi thử lại.
        Accept/reject tiếp tục dùng đúng tripRequestId cũ.

        Chờ rate limit không gia hạn lời mời.
        Kết quả trước đã commit không bị mất khi request mới nhận 429.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            errorCode: RATE_LIMIT_EXCEEDED
            message: "Bạn gửi yêu cầu quá thường xuyên. Vui lòng thử lại sau."

    ServiceUnavailable:
      description: |
        SERVICE_UNAVAILABLE.
        Không đủ phụ thuộc để xử lý an toàn.

        Không dùng cache cũ để bỏ qua kiểm tra Account,
        Session, trạng thái chuyến hoặc điều kiện phân công.

        Nếu outbox đã lưu bền vững, RabbitMQ/Notification tạm ngừng
        không tự làm mất kết quả nghiệp vụ đã commit.

        Khi accept/reject mất phản hồi:
        - Tra cứu cùng tripRequestId.
        - Có thể gửi lại cùng thao tác.
        - Không tạo ý định nhận chuyến khác để thay thế kết quả chưa rõ.

        503 không chứng minh thao tác trước chưa thực hiện.
        POST accept/GET lời mời trả 202 và Location khi đã xác nhận Saga còn xử lý.
        POST reject cạnh tranh Saga vẫn trả 409 REQUEST_IN_PROGRESS theo hợp đồng.
        Lỗi kỹ thuật không đồng nghĩa không có tài xế phù hợp.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            errorCode: SERVICE_UNAVAILABLE
            message: "Dịch vụ tạm thời không khả dụng. Vui lòng thử lại sau."

    UnexpectedError:
      description: |
        Lỗi ngoài dự kiến; dùng HTTP 5xx phù hợp.
        Không trả chi tiết nội bộ.
        Mất phản hồi không đồng nghĩa transaction chưa commit.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
