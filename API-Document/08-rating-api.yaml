openapi: 3.0.3

info:
  title: CAB System - Rating API
  version: 1.2.0
  description: |
    API đánh giá chuyến đi của CAB System.

    1. Phạm vi nghiệp vụ
    - Đánh giá chuyến đi đáp ứng tiêu chí rating trong rubric.
    - Chỉ CUSTOMER sở hữu Trip được tạo đánh giá.
    - Trip phải có tripStatus=COMPLETED.
    - Không yêu cầu Payment SUCCESS.
    - Trip CANCELLED hoặc ERROR không đủ điều kiện, kể cả ERROR đã đóng.
    - Mỗi Trip có tối đa một Rating.
    - score là số nguyên từ 1 đến 5.
    - comment là tùy chọn.
    - Không cung cấp API sửa hoặc xóa Rating trong phiên bản này.
    - Không tự khóa tài xế hoặc thay đổi điều phối vì một đánh giá thấp.
    - Chưa định nghĩa điểm trung bình, xếp hạng tài xế hoặc điểm thưởng.

    2. Kiến trúc
    - Rating Service độc lập và sở hữu cab_rating.
    - CAB Core sở hữu Account, Session, Customer, Driver và Trip.
    - Rating Service không đọc trực tiếp cab_core.
    - CAB Core không ghi trực tiếp cab_rating.
    - Rating Service gọi HTTP nội bộ đến CAB Core để xác minh danh tính
      và thông tin Trip cần cho việc đánh giá.
    - Rating, kết quả idempotency và audit được ghi trong transaction cab_rating.
    - Không giả định có transaction nguyên tử giữa hai cơ sở dữ liệu.

    3. Định tuyến
    - API công khai đi qua API Gateway đến Rating Service.
    - /trips/{tripId}/rating phải được định tuyến đến Rating Service,
      dù các API Trip khác thuộc CAB Core.
    - /drivers/me/ratings và /operations/ratings cũng thuộc Rating Service.
    - Gateway phải phân biệt các route cụ thể, không chỉ dựa vào tiền tố.
    - Hai endpoint /internal/* trong tài liệu này do CAB Core triển khai.
    - Gateway chặn các endpoint nội bộ từ bên ngoài.
    - Không mở cổng CAB Core hoặc Rating Service trực tiếp ra ngoài
      để bỏ qua Gateway.

    4. Nguồn dữ liệu có thẩm quyền
    - accountId và role lấy từ danh tính đã xác minh.
    - customerId và driverId lấy từ CAB Core.
    - driverId của Rating là tài xế đã thực hiện Trip.
    - Không lấy tài xế từ VehicleAssignment hiện tại.
    - Không nhận customerId, driverId, accountId, tripStatus hoặc createdAt
      trong body tạo Rating.
    - CAB Core kiểm tra quyền trước khi trả dữ liệu Trip.
    - Thông tin không xác minh được không được thay bằng giá trị giả định.

    5. Xác thực và phân quyền
    - Tài khoản gọi API công khai phải ACTIVE và Session còn hiệu lực.
    - JWT phải được kiểm tra chữ ký, thuật toán cho phép, issuer,
      audience, thời hạn và trạng thái Session.
    - JWT bị sửa, hết hạn hoặc Session bị thu hồi trả 401.
    - CUSTOMER chỉ tạo hoặc đọc Rating của Trip thuộc mình.
    - DRIVER chỉ đọc Rating của Trip được giao cho mình.
    - OPERATOR được đọc và tra cứu, không tạo Rating thay khách hàng.
    - DRIVER có hồ sơ chưa duyệt hoặc bị từ chối vẫn được đọc dữ liệu
      thuộc phạm vi của mình nếu Account ACTIVE và Session hợp lệ.
    - Sai vai trò trả 403.
    - Đúng vai trò nhưng Trip ngoài phạm vi truy cập trả 404.
    - Không tiết lộ Trip có Rating hay chưa cho người không có quyền.

    6. Giao tiếp nội bộ
    - Mỗi request nội bộ cần service JWT của Rating Service
      và user access token gốc của request đang xử lý.
    - Service JWT dùng để xác thực dịch vụ gọi.
    - User token dùng để xác minh người dùng mà dịch vụ đang phục vụ.
    - Không thay user token bằng accountId hoặc role do client tự khai báo.
    - CAB Core xác minh cả hai danh tính và scope của dịch vụ.
    - Token chỉ truyền qua kết nối nội bộ được bảo vệ.
    - Không đưa token vào query string hoặc log.
    - Không lưu user token trong Rating, audit hoặc kết quả idempotency.
    - Context đã đọc chỉ dùng cho request hiện tại, không tái sử dụng
      làm bằng chứng quyền truy cập lâu dài.

    7. Nhất quán giữa CAB Core và Rating Service
    - CAB Core trả snapshot Trip sau khi kiểm tra quyền.
    - Rating Service chỉ tạo Rating khi snapshot xác nhận COMPLETED.
    - Theo hợp đồng Trip hiện tại, COMPLETED là trạng thái kết thúc;
      không mở lại hoặc đổi Customer/Driver của Trip đã hoàn tất.
    - Tính bất biến này cho phép ghi Rating sau khi xác minh,
      không cần giữ transaction xuyên service.
    - Snapshot xác minh được lưu tối thiểu cho audit nội bộ,
      gồm tripId, tripVersion, customerId, driverId và verifiedAt.
    - Không giữ transaction cab_rating trong lúc chờ HTTP đến CAB Core.
    - Nếu sau này cho phép mở lại hoặc chuyển chủ thể của Trip đã hoàn tất,
      phải thiết kế lại cơ chế xác minh trước khi triển khai thay đổi đó.
    - Quyền được đánh giá tại bước xác minh của request;
      không tuyên bố kiểm tra Session và ghi Rating là một transaction xuyên service.

    8. Chống trùng
    - Unique constraint trên Rating.tripId là bắt buộc.
    - Kiểm tra tồn tại trước khi ghi không thay thế unique constraint.
    - POST tạo Rating yêu cầu Idempotency-Key.
    - Phạm vi key gồm accountId, operation và tripId.
    - Cùng key, cùng nội dung chuẩn hóa trả status code và body đã lưu.
    - Cùng key, nội dung khác trả 409 IDEMPOTENCY_CONFLICT.
    - Request cùng key đang xử lý trả 409 REQUEST_IN_PROGRESS.
    - Kiểm tra quyền hiện tại trước khi replay.
    - Replay hợp lệ được kiểm tra trước điều kiện Rating đã tồn tại.
    - Key mới khi Trip đã có Rating trả 409 RATING_ALREADY_EXISTS.
    - Ghi Rating, kết quả idempotency và audit trong cùng transaction.
    - Không tạo thêm audit nghiệp vụ khi replay.
    - Không chỉ dùng cache tạm thời để bảo vệ thao tác tạo Rating.

    9. An toàn dữ liệu và hiển thị
    - comment tối đa 1000 ký tự trước khi chuẩn hóa.
    - Trim khoảng trắng đầu và cuối.
    - Comment rỗng sau trim được coi như không có comment.
    - Không nhận null thay cho comment; bỏ trường nếu không nhận xét.
    - Comment được xử lý như văn bản thuần.
    - Không ghép comment vào SQL hoặc thực thi như mã.
    - Giao diện phải encode theo ngữ cảnh và hiển thị như text.
    - Payload chứa thẻ HTML hoặc script không được thực thi khi hiển thị.
    - Không tự đính kèm email, phone, giấy phép, vị trí GPS hoặc dữ liệu thanh toán.
    - Không ghi toàn bộ comment hoặc token vào log truy cập thông thường.
    - Không chấp nhận trường body hoặc query parameter ngoài hợp đồng.

    10. Vận hành
    - Mọi response sử dụng Cache-Control: no-store.
    - API công khai có rate limit tại Gateway và trả 429 khi vượt hạn mức.
    - HTTP nội bộ có timeout và giới hạn retry.
    - Retry HTTP xác minh không tự tạo thêm Rating.
    - CAB Core không sẵn sàng hoặc response nội bộ không hợp lệ thì trả 503.
    - Không trả 404 giả, danh sách rỗng giả hoặc score=0 khi dependency lỗi.
    - Lỗi xác thực service hoặc cấu hình liên dịch vụ được ánh xạ thành 503
      ở API công khai, không báo sai rằng user JWT hết hạn.
    - Lỗi danh tính người dùng thực sự được ánh xạ thành 401 hoặc 403 phù hợp.
    - correlationId được chuyển qua Gateway, Rating Service và CAB Core.
    - Định nghĩa API không thay thế kiểm thử IPC và bảo mật thực tế.

servers:
  - url: /v1
    description: API công khai qua Gateway, được xử lý bởi Rating Service

security:
  - bearerAuth: []

tags:
  - name: Trip Ratings
    description: Khách hàng tạo và người có quyền đọc đánh giá chuyến
  - name: Driver Ratings
    description: Tài xế xem đánh giá dành cho mình
  - name: Operational Ratings
    description: Điều hành viên tra cứu đánh giá
  - name: Internal Rating Context
    description: API CAB Core phục vụ xác minh cho Rating Service

paths:
  /trips/{tripId}/rating:
    post:
      tags: [Trip Ratings]
      operationId: createTripRating
      summary: Khách hàng đánh giá chuyến đã hoàn tất
      x-service-owner: rating
      description: |
        Chỉ CUSTOMER sở hữu Trip.

        Rating Service gọi endpoint rating-context của CAB Core
        bằng service JWT và user token của request hiện tại.
        CAB Core xác minh Account, Session, quyền sở hữu và trả snapshot Trip.

        Điều kiện tạo mới:
        - Người gọi là CUSTOMER.
        - Trip thuộc Customer đang đăng nhập.
        - Trip có tripStatus=COMPLETED.
        - Trip chưa có Rating.

        Không kiểm tra Payment SUCCESS.
        Vẫn cho phép đánh giá khi chưa có Payment hoặc Payment đang
        PENDING, PROCESSING, FAILED hay UNKNOWN.
        Không phụ thuộc việc Fare đã được tính xong hay chưa.

        Request chỉ nhận score và comment tùy chọn.
        Chuỗi "5", boolean hoặc số không nguyên không hợp lệ cho score.
        Comment vượt 1000 ký tự trước khi trim trả 400.
        Comment rỗng sau trim được bỏ khỏi dữ liệu lưu và response.

        Quy trình:
        - Kiểm tra cấu trúc request và thông tin xác thực.
        - Xác minh quyền hiện tại qua CAB Core.
        - Chuẩn hóa nội dung và kiểm tra idempotency.
        - Replay hợp lệ trả lại response 201 đã lưu.
        - Với thao tác mới, kiểm tra Trip COMPLETED.
        - Ghi Rating, idempotency và audit trong transaction cab_rating.
        - customerId và driverId lấy từ snapshot CAB Core.

        Hai key khác nhau cùng tạo đánh giá:
        - Unique constraint tripId chỉ cho phép một bản ghi.
        - Request còn lại trả 409 RATING_ALREADY_EXISTS.
        - Không trả lỗi 500 chỉ vì tranh chấp unique constraint đã biết.

        Nếu CAB Core không xác minh được, không tạo Rating.
        Nếu đã commit nhưng mất response, gửi lại cùng key để lấy kết quả cũ.
        Không đổi Trip, Driver, Fare hoặc Payment.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRatingRequest'
            example:
              score: 5
              comment: Tài xế đến đúng điểm đón và lái xe cẩn thận.
      responses:
        '201':
          description: Đã tạo đánh giá hoặc replay kết quả 201 đã lưu
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              description: Đường dẫn đọc Rating
              schema:
                type: string
                example: /v1/trips/trip_001/rating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

    get:
      tags: [Trip Ratings]
      operationId: getTripRating
      summary: Xem đánh giá của một chuyến
      x-service-owner: rating
      description: |
        Cho phép CUSTOMER sở hữu Trip, DRIVER được giao Trip và OPERATOR.

        Rating Service gọi rating-context của CAB Core để xác minh
        quyền truy cập Trip trước khi trả hoặc tiết lộ sự tồn tại của Rating.

        Trip không tồn tại hoặc ngoài phạm vi truy cập:
        - Trả 404 TRIP_NOT_FOUND.

        Được phép xem Trip nhưng chưa có Rating:
        - Trả 404 RATING_NOT_FOUND.
        - Không tạo đánh giá mặc định.
        - Không trả score=0 để biểu thị chưa có đánh giá.

        GET chỉ đọc dữ liệu.
        Thay xe hoặc thay trạng thái hoạt động của Driver sau chuyến
        không thay driverId đã lưu trong Rating.
        Không phụ thuộc Payment hiện tại.
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          $ref: '#/components/responses/RatingRead'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TripRatingNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /drivers/me/ratings:
    get:
      tags: [Driver Ratings]
      operationId: listMyDriverRatings
      summary: Tài xế xem đánh giá dành cho mình
      x-service-owner: rating
      description: |
        Chỉ DRIVER có Account ACTIVE và Session hợp lệ.

        Rating Service gọi /internal/rating/identity để xác minh danh tính
        và lấy driverId từ CAB Core.

        Không nhận driverId, customerId hoặc accountId từ query.
        Chỉ truy vấn Rating có driverId tương ứng với tài khoản hiện tại.
        Không yêu cầu Driver đang AVAILABLE hoặc đang phục vụ Trip.

        Có thể lọc theo score.
        Sắp xếp createdAt giảm dần, sau đó ratingId giảm dần.
        Cursor gắn với tài khoản, endpoint, score và limit.

        Phân trang keyset không phải snapshot bất biến.
        Đánh giá mới có thể được tạo giữa các lần lấy trang.
        Tải lại trang đầu để làm mới danh sách.

        Chưa có Rating thì trả items=[] và nextCursor=null.
        Nếu không xác minh được danh tính do CAB Core lỗi, trả 503;
        không dùng danh sách rỗng thay cho lỗi.
      parameters:
        - $ref: '#/components/parameters/ScoreFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/RatingListRead'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /operations/ratings:
    get:
      tags: [Operational Ratings]
      operationId: listOperationalRatings
      summary: Điều hành viên tra cứu đánh giá
      x-service-owner: rating
      description: |
        Chỉ OPERATOR.

        Rating Service gọi /internal/rating/identity của CAB Core
        để xác minh Account, Session và role hiện tại.

        Truy vấn Rating từ cab_rating.
        Không join trực tiếp cab_core để lấy dữ liệu tài khoản hoặc Trip.

        Có thể lọc driverId, tripId và score.
        Các bộ lọc kết hợp theo AND.

        from/to lọc Rating.createdAt theo khoảng [from, to).
        Nếu có cả hai thì from phải nhỏ hơn to.
        Thời gian phải có thông tin múi giờ.

        Sắp xếp createdAt giảm dần, sau đó ratingId giảm dần.
        Cursor gắn với người gọi, endpoint, toàn bộ bộ lọc và limit.
        Phân trang không đóng băng dữ liệu mới phát sinh.

        Không có kết quả phù hợp thì trả items=[] và nextCursor=null.
        ID dùng làm bộ lọc không có kết quả không bắt buộc trả 404.
        Endpoint không cho phép sửa hoặc xóa Rating.

        Route này thuộc Rating Service dù có tiền tố /operations.
        Không định nghĩa một bản triển khai khác trong Operations của CAB Core.
      parameters:
        - name: driverId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Identifier'
        - name: tripId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Identifier'
        - $ref: '#/components/parameters/ScoreFilter'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/RatingListRead'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /internal/rating/identity:
    get:
      tags: [Internal Rating Context]
      operationId: verifyRatingUserIdentity
      summary: CAB Core xác minh người dùng cho Rating Service
      x-internal: true
      x-service-owner: cab-core
      servers:
        - url: http://{coreHost}:{corePort}/v1
          description: |
            Địa chỉ nội bộ dự kiến của CAB Core.
            Host và port phải khớp cấu hình Docker Compose.
            Kết nối phải được bảo vệ theo môi trường triển khai.
          variables:
            coreHost:
              default: cab-core-api
            corePort:
              default: '3000'
      security:
        - serviceBearer: []
          delegatedUserToken: []
      description: |
        Do CAB Core triển khai, chỉ Rating Service được phép gọi
        với scope rating:context:read.

        Bắt buộc đồng thời:
        - Authorization chứa service JWT.
        - X-User-Authorization chứa user access token gốc dạng Bearer.

        CAB Core:
        - Xác minh service JWT, audience, scope và danh tính dịch vụ.
        - Xác minh user JWT, Session và Account ACTIVE.
        - Lấy role, customerId hoặc driverId từ dữ liệu có thẩm quyền.
        - Trả thông tin định danh tối thiểu và verifiedAt.

        Không nhận accountId, role, customerId hoặc driverId từ query.
        Không có request body.
        Không trả token, email, phone hoặc dữ liệu hồ sơ cá nhân.

        Endpoint không tự cấp quyền cho API người dùng.
        Rating Service vẫn kiểm tra role phù hợp với operation đang xử lý.

        x-internal chỉ là mô tả; Gateway và cấu hình mạng phải thực sự
        ngăn truy cập endpoint từ bên ngoài.
      responses:
        '200':
          description: Danh tính người dùng đã được xác minh
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedRatingIdentity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalUnauthorized'
        '403':
          $ref: '#/components/responses/InternalForbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /internal/trips/{tripId}/rating-context:
    get:
      tags: [Internal Rating Context]
      operationId: getTripRatingContext
      summary: CAB Core xác minh quyền và cung cấp snapshot Trip cho Rating
      x-internal: true
      x-service-owner: cab-core
      servers:
        - url: http://{coreHost}:{corePort}/v1
          description: |
            Endpoint nội bộ do CAB Core triển khai.
            Không công khai qua API Gateway.
          variables:
            coreHost:
              default: cab-core-api
            corePort:
              default: '3000'
      security:
        - serviceBearer: []
          delegatedUserToken: []
      description: |
        Chỉ Rating Service với scope rating:context:read.

        CAB Core xác minh cả service JWT và user JWT.
        Kiểm tra Account ACTIVE và Session hợp lệ.

        Quyền đọc context:
        - CUSTOMER sở hữu Trip.
        - DRIVER được giao Trip.
        - OPERATOR.

        CUSTOMER hoặc DRIVER không có quan hệ phù hợp nhận 404 TRIP_NOT_FOUND.
        Kiểm tra quyền trước khi trả thông tin Trip.

        Trả snapshot nhất quán gồm:
        - Danh tính người dùng đã xác minh.
        - tripId, customerId, driverId, tripStatus và tripVersion.
        - completedAt nếu Trip COMPLETED.
        - verifiedAt từ server.

        Endpoint không ghi Rating và không kiểm tra cab_rating.
        Không gọi ngược Rating Service để xác định Rating đã tồn tại.

        Trip chưa COMPLETED vẫn có thể trả context 200 cho người có quyền.
        Rating Service quyết định trả 409 TRIP_NOT_COMPLETED khi tạo mới.
        GET Rating dùng cùng context để phân biệt không có quyền
        với có quyền nhưng chưa có Rating.

        Context không chứa Payment, Fare, GPS, địa chỉ hoặc thông tin liên hệ.
        Không kiểm tra thanh toán như điều kiện cấp context.

        Đây là dữ liệu xác minh cho request hiện tại, không phải token
        hoặc quyền truy cập có thể tái sử dụng về sau.
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Danh tính và snapshot Trip đã được xác minh
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripRatingContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalUnauthorized'
        '403':
          $ref: '#/components/responses/InternalForbidden'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        User access token của API công khai.
        Kiểm tra JWT và xác minh Account, Session qua CAB Core.
        Không tin danh tính hoặc role do request body tự khai báo.

    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Service JWT của Rating Service.
        Audience dành cho CAB Core, scope rating:context:read.
        User JWT không được thay service JWT.

    delegatedUserToken:
      type: apiKey
      in: header
      name: X-User-Authorization
      description: |
        User access token gốc theo định dạng Bearer <access-token>.
        Đây là token người dùng được chuyển tiếp, không phải API key tĩnh.
        CAB Core phải xác minh độc lập token và Session tương ứng.
        Chỉ chấp nhận khi serviceBearer cũng hợp lệ.
        Gateway không được tin header này do client tự đặt
        như bằng chứng danh tính cho API công khai.
        Rating Service tự tạo header từ request đã tiếp nhận.

  headers:
    NoStore:
      description: Không lưu response vào bộ nhớ đệm
      schema:
        type: string
        enum: [no-store]

    RetryAfter:
      description: Số giây tối thiểu nên chờ trước khi thử lại
      schema:
        type: integer
        minimum: 1

  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Khóa ổn định của yêu cầu tạo Rating.
        Phạm vi accountId, operation và tripId.
        Gửi lại cùng thao tác phải giữ nguyên key và nội dung.
        Không dùng lại key cho nhận xét hoặc score khác.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'

    ScoreFilter:
      name: score
      in: query
      required: false
      description: Lọc đánh giá có đúng số điểm này
      schema:
        $ref: '#/components/schemas/RatingScore'

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Cursor opaque do server phát hành.
        Gắn với người gọi, endpoint, toàn bộ bộ lọc và limit.
        Không hợp lệ, khác phạm vi hoặc hết hạn trả 400.
      schema:
        type: string
        minLength: 1
        maxLength: 2048

  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128

    Version:
      type: integer
      format: int64
      minimum: 1

    RatingScore:
      type: integer
      minimum: 1
      maximum: 5
      description: Điểm nguyên từ 1 đến 5; không tự ép chuỗi thành số

    TripStatus:
      type: string
      enum:
        - DRIVER_ASSIGNED
        - ARRIVED_PICKUP
        - PICKED_UP
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
        - ERROR

    CreateRatingRequest:
      type: object
      additionalProperties: false
      required:
        - score
      properties:
        score:
          $ref: '#/components/schemas/RatingScore'
        comment:
          type: string
          maxLength: 1000
          description: |
            Nhận xét tùy chọn, tối đa 1000 ký tự trước khi trim.
            Văn bản thuần, không nhận null.
            Trim đầu/cuối; rỗng sau trim được coi như không có comment.

    Rating:
      type: object
      additionalProperties: false
      required:
        - ratingId
        - tripId
        - customerId
        - driverId
        - score
        - createdAt
      properties:
        ratingId:
          $ref: '#/components/schemas/Identifier'
        tripId:
          $ref: '#/components/schemas/Identifier'
        customerId:
          $ref: '#/components/schemas/Identifier'
        driverId:
          $ref: '#/components/schemas/Identifier'
        score:
          $ref: '#/components/schemas/RatingScore'
        comment:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '\S'
          description: |
            Nhận xét đã chuẩn hóa.
            Bỏ khỏi response nếu không có nội dung.
            Client hiển thị như text, không thực thi HTML/script.
        createdAt:
          type: string
          format: date-time
          description: Thời điểm server tạo Rating, không đổi khi replay
      description: |
        Một Rating duy nhất trên mỗi Trip.
        customerId và driverId phản ánh chủ thể của Trip đã hoàn tất.
        Không thay đổi theo phân công xe hiện tại.
        Không chứa thông tin xác thực hoặc các trường liên hệ cá nhân.

    RatingPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Rating'
        nextCursor:
          type: string
          nullable: true
          description: null khi không còn trang tiếp theo tại thời điểm truy vấn

    VerifiedRatingIdentity:
      type: object
      additionalProperties: false
      required:
        - accountId
        - role
        - verifiedAt
      properties:
        accountId:
          $ref: '#/components/schemas/Identifier'
        role:
          type: string
          enum: [CUSTOMER, DRIVER, OPERATOR]
        customerId:
          $ref: '#/components/schemas/Identifier'
        driverId:
          $ref: '#/components/schemas/Identifier'
        verifiedAt:
          type: string
          format: date-time
          description: Thời điểm CAB Core xác minh Account và Session
      oneOf:
        - required:
            - customerId
          properties:
            role:
              type: string
              enum: [CUSTOMER]
          not:
            required:
              - driverId
        - required:
            - driverId
          properties:
            role:
              type: string
              enum: [DRIVER]
          not:
            required:
              - customerId
        - properties:
            role:
              type: string
              enum: [OPERATOR]
          not:
            anyOf:
              - required: [customerId]
              - required: [driverId]
      description: |
        Chỉ dùng cho giao tiếp nội bộ.
        Không chứa user token, Session secret, phone hoặc email.
        Tài khoản không ACTIVE hoặc Session không hợp lệ không nhận schema này.

    TripRatingContext:
      type: object
      additionalProperties: false
      required:
        - principal
        - tripId
        - customerId
        - driverId
        - tripStatus
        - tripVersion
        - verifiedAt
      properties:
        principal:
          $ref: '#/components/schemas/VerifiedRatingIdentity'
        tripId:
          $ref: '#/components/schemas/Identifier'
        customerId:
          $ref: '#/components/schemas/Identifier'
        driverId:
          $ref: '#/components/schemas/Identifier'
        tripStatus:
          $ref: '#/components/schemas/TripStatus'
        tripVersion:
          $ref: '#/components/schemas/Version'
        completedAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
          description: Thời điểm kiểm tra quyền và đọc snapshot Trip
      oneOf:
        - required:
            - completedAt
          properties:
            tripStatus:
              type: string
              enum: [COMPLETED]
        - properties:
            tripStatus:
              type: string
              enum:
                - DRIVER_ASSIGNED
                - ARRIVED_PICKUP
                - PICKED_UP
                - IN_PROGRESS
                - CANCELLED
                - ERROR
          not:
            required:
              - completedAt
      description: |
        Snapshot nội bộ từ CAB Core.
        principal là người đang gọi API.
        customerId và driverId bên ngoài principal là các bên của Trip.
        CAB Core phải xác minh quan hệ tương ứng trước khi trả context.
        Context không phải response công khai của Rating API.

    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - errorCode
        - message
        - correlationId
      properties:
        errorCode:
          type: string
          description: Mã lỗi ổn định để client xử lý
        message:
          type: string
          description: Thông báo an toàn, không lộ stack trace hoặc bí mật
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        correlationId:
          type: string
          description: Mã liên kết log giữa Gateway, Rating Service và CAB Core

  responses:
    RatingRead:
      description: Đánh giá của chuyến trong phạm vi được phép
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Rating'

    RatingListRead:
      description: Danh sách đánh giá phù hợp
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RatingPage'

    BadRequest:
      description: |
        VALIDATION_ERROR, INVALID_CURSOR, CURSOR_EXPIRED
        hoặc INVALID_TIME_RANGE.

        Bao gồm:
        - score không phải số nguyên trong khoảng 1..5.
        - comment vượt giới hạn hoặc có giá trị null.
        - Body có trường không được phép.
        - Query có tham số ngoài hợp đồng.
        - Thiếu hoặc sai định dạng Idempotency-Key.
        - Khoảng thời gian không hợp lệ.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: |
        UNAUTHENTICATED.
        Thiếu user token, token không hợp lệ, bị sửa, hết hạn
        hoặc Session hết hiệu lực.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: |
        FORBIDDEN hoặc ACCOUNT_INACTIVE.
        Tài khoản không ACTIVE hoặc role không được phép gọi operation.
        Ví dụ DRIVER hoặc OPERATOR gọi POST tạo Rating.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalUnauthorized:
      description: |
        UNAUTHENTICATED_SERVICE nếu service JWT không hợp lệ.
        UNAUTHENTICATED nếu user JWT hoặc Session không hợp lệ.

        Rating Service phân biệt hai trường hợp:
        - Lỗi service được ánh xạ thành 503 tại API công khai.
        - Lỗi người dùng được ánh xạ thành 401 tại API công khai.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalForbidden:
      description: |
        FORBIDDEN_SERVICE nếu dịch vụ không có danh tính hoặc scope phù hợp.
        ACCOUNT_INACTIVE hoặc FORBIDDEN nếu người dùng không có quyền.

        Lỗi quyền của dịch vụ được ánh xạ thành 503 tại API công khai.
        Lỗi quyền của người dùng được ánh xạ thành 403.
        Trip ngoài phạm vi của CUSTOMER hoặc DRIVER sử dụng 404.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TripNotFound:
      description: |
        TRIP_NOT_FOUND.
        Trip không tồn tại hoặc ngoài phạm vi truy cập.
        Không tiết lộ Rating tồn tại hay chưa.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TripRatingNotFound:
      description: |
        TRIP_NOT_FOUND nếu Trip không tồn tại hoặc ngoài phạm vi truy cập.
        RATING_NOT_FOUND nếu được xem Trip nhưng chưa có Rating.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: |
        Xung đột nghiệp vụ hoặc idempotency.

        Mã lỗi:
        - TRIP_NOT_COMPLETED.
        - RATING_ALREADY_EXISTS.
        - IDEMPOTENCY_CONFLICT.
        - REQUEST_IN_PROGRESS.

        Trip đã có Rating thì có thể đọc bằng GET /trips/{tripId}/rating.
        Không tự ghi đè Rating hiện có khi nhận request mới.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
      description: |
        RATE_LIMIT_EXCEEDED.
        Vượt hạn mức tại API Gateway.
        Khi thử lại POST, giữ nguyên Idempotency-Key và nội dung.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: |
        SERVICE_UNAVAILABLE.
        Rating database, CAB Core hoặc thành phần cần thiết tạm thời không sẵn sàng.
        Bao gồm timeout hoặc không xác minh được hợp đồng phản hồi nội bộ.

        Không tạo Rating từ dữ liệu chưa được xác minh.
        Không trả danh sách rỗng hoặc 404 thay cho lỗi dependency.
        HTTP 503 không chứng minh thao tác ghi chắc chắn chưa commit.
        Client gửi lại cùng Idempotency-Key và nội dung để xác định kết quả.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnexpectedError:
      description: |
        INTERNAL_ERROR.
        Không trả stack trace, token, chuỗi kết nối hoặc thông tin xác thực.
        Nếu mất kết quả POST, thử lại cùng Idempotency-Key và nội dung.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
