          $ref: "#/components/schemas/EventId"
        recipientAccountId:
          $ref: "#/components/schemas/Identifier"
        eventType:
          $ref: "#/components/schemas/NotificationEventType"
        referenceType:
          $ref: "#/components/schemas/ReferenceType"
        referenceId:
          $ref: "#/components/schemas/Identifier"
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        deliveryStatus:
          $ref: "#/components/schemas/DeliveryStatus"
        occurredAt:
          type: string
          format: date-time
          description: Thời điểm nghiệp vụ phát sinh tại nguồn
        createdAt:
          type: string
          format: date-time
          description: Thời điểm tạo Notification lần đầu
        updatedAt:
          type: string
          format: date-time
          description: Thời điểm cập nhật xử lý gần nhất
        publishedAt:
          type: string
          format: date-time
          description: Thời điểm công bố lần đầu, không đổi khi xử lý lặp
      oneOf:
        - required:
            - publishedAt
          properties:
            deliveryStatus:
              type: string
              enum:
                - SENT
        - properties:
            deliveryStatus:
              type: string
              enum:
                - PENDING
                - FAILED
          not:
            required:
              - publishedAt
      description: |
        Kết quả dành cho dịch vụ nội bộ.
        Không trả trạng thái đọc, nội dung inbox thô hoặc lỗi hạ tầng chi tiết.
        Trường không áp dụng được bỏ khỏi response, không trả null.
    PendingNotificationReceipt:
      allOf:
        - $ref: "#/components/schemas/NotificationReceipt"
        - type: object
          properties:
            deliveryStatus:
              type: string
              enum:
                - PENDING
    Notification:
      type: object
      additionalProperties: false
      required:
        - notificationId
        - eventId
        - recipientAccountId
        - eventType
        - referenceType
        - referenceId
        - channel
        - deliveryStatus
        - title
        - message
        - isRead
        - occurredAt
        - createdAt
        - publishedAt
      properties:
        notificationId:
          $ref: "#/components/schemas/Identifier"
        eventId:
          $ref: "#/components/schemas/EventId"
        recipientAccountId:
          $ref: "#/components/schemas/Identifier"
        eventType:
          $ref: "#/components/schemas/NotificationEventType"
        referenceType:
          $ref: "#/components/schemas/ReferenceType"
        referenceId:
          $ref: "#/components/schemas/Identifier"
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        deliveryStatus:
          type: string
          enum:
            - SENT
          description: Hộp thư người dùng chỉ chứa thông báo đã công bố
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Tiêu đề văn bản thuần do template phía server tạo
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Nội dung văn bản thuần.
            Client không được thực thi như HTML hoặc script.
            Mô tả sự kiện đã xảy ra, không bảo đảm trạng thái hiện tại.
            Không chứa dữ liệu nhạy cảm hoặc thông tin nội bộ không cần thiết.
        isRead:
          type: boolean
          description: Đã có thao tác đánh dấu đọc hợp lệ hay chưa
        readAt:
          type: string
          format: date-time
          description: |
            Có khi và chỉ khi isRead=true.
            Thời gian máy chủ của lần đánh dấu đọc thành công đầu tiên.
        occurredAt:
          type: string
          format: date-time
          description: |
            Thời điểm nghiệp vụ phát sinh tại nguồn.
            Có thể sớm hơn thời điểm công bố nếu xử lý bị chậm.
        createdAt:
          type: string
          format: date-time
          description: Thời điểm tạo Notification lần đầu
        publishedAt:
          type: string
          format: date-time
          description: Thời điểm công bố trong hộp thư lần đầu
      oneOf:
        - properties:
            isRead:
              type: boolean
              enum:
                - false
          not:
            required:
              - readAt
        - required:
            - readAt
          properties:
            isRead:
              type: boolean
              enum:
                - true
    ReadNotification:
      allOf:
        - $ref: "#/components/schemas/Notification"
        - type: object
          required:
            - readAt
          properties:
            isRead:
              type: boolean
              enum:
                - true
    NotificationPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type: string
          nullable: true
          description: |
            Cursor trang tiếp theo.
            null nếu không còn kết quả phù hợp tại thời điểm truy vấn.
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
          description: Thông báo an toàn để hiển thị
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - errorCode
        - message
        - correlationId
      properties:
        errorCode:
          type: string
          description: Mã lỗi ổn định cho client xử lý
        message:
          type: string
          description: Không chứa stack trace, thông tin xác thực hoặc bí mật
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
        correlationId:
          type: string
          description: Định danh để tra cứu log và audit liên quan
  responses:
    BadRequest:
      description: |
        Request không hợp lệ.
        errorCode có thể là VALIDATION_ERROR, INVALID_CURSOR,
        CURSOR_EXPIRED, INVALID_EVENT_REFERENCE hoặc UNSUPPORTED_CHANNEL.
        Không chấp nhận trường request hoặc query parameter ngoài hợp đồng.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: |
        UNAUTHENTICATED.
        Thiếu token, token không hợp lệ, bị sửa hoặc hết hạn.
        Bao gồm session hết hạn hoặc đã bị thu hồi.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: |
        FORBIDDEN hoặc ACCOUNT_INACTIVE.
        Danh tính đã xác thực nhưng không được sử dụng API.
        Driver PENDING hoặc REJECTED không phải lý do từ chối hộp thư
        nếu tài khoản vẫn ACTIVE và session hợp lệ.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnauthorized:
      description: |
        UNAUTHENTICATED_SERVICE.
        Thiếu hoặc không xác minh được service JWT.
        Không chấp nhận user JWT thay thế.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceForbidden:
      description: |
        SERVICE_PERMISSION_DENIED, EVENT_TYPE_NOT_ALLOWED
        hoặc RECIPIENT_NOT_ALLOWED.
        Dịch vụ thiếu quyền, loại sự kiện ngoài phạm vi được phép,
        hoặc người nhận không thuộc tập người nhận của sự kiện.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    EventNotFound:
      description: |
        EVENT_NOT_FOUND.
        Không tìm thấy sự kiện đã tiếp nhận hợp lệ trong inbox.
        Chỉ trả sau khi đã xác thực và kiểm tra quyền dịch vụ.
        Không chứng minh nghiệp vụ gốc chưa xảy ra; sự kiện có thể chưa đến.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotificationNotFound:
      description: |
        NOTIFICATION_NOT_FOUND.
        Dùng cùng phản hồi khi ID không tồn tại, thuộc tài khoản khác,
        hoặc thông báo chưa được công bố.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: |
        EVENT_PAYLOAD_CONFLICT.
        Nội dung không khớp sự kiện đã lưu hoặc bản ghi cùng khóa.
        Không ghi đè sự kiện, người nhận hay thông báo đã tiếp nhận.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: |
        RATE_LIMIT_EXCEEDED.
        Vượt hạn mức API công khai tại Gateway.
        Client chờ theo Retry-After trước khi thử lại.
        Gọi lại thao tác đánh dấu đọc không thay readAt đã ghi.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: |
        SERVICE_UNAVAILABLE.
        Thành phần cần thiết cho thao tác tạm thời không sẵn sàng.

        Nếu mất kết quả POST nội bộ, gửi lại cùng eventId và nội dung.
        Nếu mất kết quả PATCH read, có thể gọi lại cùng notificationId.

        Không suy ra nghiệp vụ gốc đã thất bại.
        Không tạo eventId hoặc notificationId mới chỉ để vượt qua lỗi.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnexpectedError:
      description: |
        INTERNAL_ERROR.
        Không trả stack trace, chuỗi kết nối, token hoặc thông tin xác thực.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
x-internal-workflows:
  ensureNotification:
    owner: notification-service
    formerOperationId: createInternalNotification
    formerHttpPath: POST /notifications
    transport: LOCAL_USE_CASE
    inputSchema:
      $ref: "#/components/schemas/CreateNotificationRequest"
    description: Consumer lưu inbox và công việc fan-out bền vững trước ACK. Worker gọi ca sử dụng với
      eventId/recipientAccountId/channel từ inbox đã xác minh, không nhận event giả hay nội dung tự do từ
      client. Kiểm tra eventType/referenceType/referenceId khớp inbox và recipient thuộc tập đã lưu.
      Unique(eventId,recipientAccountId,channel) chống tạo trùng. Tạo PENDING và job trong cùng transaction
      cab_notification; cùng khóa trả hiện trạng, không đổi notificationId/isRead/readAt. Nội dung mâu thuẫn
      phải cách ly/audit. FAILED không tự reset; thao tác phục hồi có kiểm soát giữ cùng ID, tăng retry
      metadata và không đổi nội dung lịch sử. Ca sử dụng và worker dùng cùng ràng buộc. Không cần HTTP gọi vào
      chính service; nếu phát sinh bên gọi khác phải chốt .proto/scope theo D04, không tự mở quyền cho
      OPERATOR.
