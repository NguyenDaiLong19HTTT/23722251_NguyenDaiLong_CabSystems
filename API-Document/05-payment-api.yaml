openapi: 3.0.3

info:
  title: CAB System - Fare & Payment API
  version: 1.2.0
  description: |
    API tính cước và thanh toán của CAB System.

    1. Phạm vi và kiến trúc
    - Billing/Fare & Payment là module thuộc CAB Core.
    - Trip, Fare, Payment và PaymentAttempt sử dụng cơ sở dữ liệu cab_core.
    - Các cập nhật nghiệp vụ liên quan phải bảo đảm transaction trong CAB Core.
    - Mọi HTTP request từ bên ngoài, kể cả webhook thanh toán, đi qua API Gateway.
    - Endpoint reconcile chỉ dành cho dịch vụ nội bộ, không công khai qua Gateway.
    - CAB Core ghi sự kiện vào transactional outbox.
    - Worker chuyển sự kiện qua RabbitMQ để Notification Service xử lý.
    - Notification lỗi không được làm mất hoặc đảo ngược thanh toán đã ghi nhận.

    2. Quy tắc tính cước
    - Chỉ có Fare cuối cùng khi Trip có trạng thái COMPLETED.
    - JourneyMetrics phải được xác nhận trước khi tạo Fare.
    - Một Trip có tối đa một Fare cuối cùng.
    - Giá sử dụng PricingSnapshot đã chốt cho Booking.
    - Không sử dụng bảng giá hiện tại để tính lại chuyến đã đặt.
    - Không dùng khoảng cách đường chim bay thay cho quãng đường thực tế.
    - Không thay dữ liệu hành trình còn thiếu bằng số 0.
    - Fare giữ thông tin phiên bản giá và phiên bản JourneyMetrics để truy vết.
    - Fare đã phát hành không được âm thầm sửa khi dữ liệu nguồn thay đổi.

    3. Tiền tệ và làm tròn
    - Tiền tệ của phiên bản này là VND.
    - Tính toán phía server sử dụng kiểu decimal chính xác.
    - Không dùng số thực nhị phân để quyết định số tiền phải thu.
    - Không làm tròn riêng từng thành phần trước khi cộng.
    - Tổng cuối cùng được làm tròn đến một đồng theo ROUND_HALF_UP.
    - Ví dụ tổng trước làm tròn 10000.5 VND trở thành 10001 VND.
    - Giá trị 0 chỉ hợp lệ khi được tính từ dữ liệu đầy đủ và hợp lệ.

    4. Mô hình thanh toán
    - Một Fare có tối đa một Payment.
    - Một Payment có thể có nhiều PaymentAttempt theo thứ tự.
    - Không được mở thêm attempt khi attempt trước còn có thể thu tiền.
    - Payment thành công sử dụng trạng thái SUCCESS.
    - SUCCESS tương ứng ý nghĩa thanh toán COMPLETED trong rubric.
    - Trip COMPLETED không đồng nghĩa Payment SUCCESS.
    - Chọn CASH không đồng nghĩa đã nhận tiền.
    - Browser quay về returnUrl không phải bằng chứng thanh toán thành công.
    - Timeout, mất kết nối hoặc hết hạn checkout không đủ để kết luận FAILED.

    5. Trạng thái
    - PENDING: đã tạo, đang chờ xử lý hoặc chờ xác nhận tiền mặt.
    - PROCESSING: đang xử lý thanh toán online.
    - SUCCESS: đã có bằng chứng hợp lệ xác nhận thanh toán thành công.
    - FAILED: đã có kết quả thất bại cuối cùng, đủ căn cứ cho phép thử lại.
    - UNKNOWN: chưa xác định chắc chắn kết quả, cần đối soát.
    - SUCCESS không được hạ xuống FAILED hoặc UNKNOWN.
    - requiresReview là cờ cần kiểm tra nghiệp vụ, độc lập với paymentStatus.
    - requiresReview=true chặn tạo attempt mới và xác nhận tiền mặt.
    - Không thay đổi trạng thái Trip hoặc tài xế khi thanh toán hoàn tất.

    6. Chống thanh toán trùng
    - Endpoint tạo Payment, retry và confirm-cash yêu cầu Idempotency-Key.
    - Replay cùng key và cùng nội dung trả lại status code và body đã lưu.
    - Cùng key nhưng nội dung khác trả 409 IDEMPOTENCY_CONFLICT.
    - Kiểm tra quyền hiện tại trước khi trả kết quả replay.
    - Sau kiểm tra cấu trúc request, kiểm tra replay trước các điều kiện
      có thể thay đổi như version, trạng thái Payment hoặc cấu hình phương thức.
    - Ràng buộc một Payment trên một Fare vẫn bắt buộc khi client đổi key.
    - PaymentAttempt và merchantReference được lưu trước khi gọi nhà cung cấp.
    - Idempotency-Key của API không tự bảo đảm nhà cung cấp chỉ thu tiền một lần.
    - Adapter phải sử dụng cơ chế idempotency hoặc tra cứu giao dịch tương ứng
      với hợp đồng của nhà cung cấp.
    - Không gửi lại yêu cầu thu tiền một cách mù quáng sau timeout hoặc crash.
    - Nếu không xác định được yêu cầu trước đã được tiếp nhận hay chưa,
      chuyển sang UNKNOWN và đối soát trước khi cho phép thử lại.

    7. Thanh toán online
    - Chỉ cho phép phương thức có adapter đã cấu hình và đang được hỗ trợ.
    - E_WALLET và CREDIT_CARD là các loại phương thức của hệ thống;
      không có nghĩa phiên bản đầu tiên phải tích hợp tất cả nhà cung cấp.
    - Số tiền, tiền tệ, người trả và mã giao dịch liên kết do server xác định.
    - Không nhận số tiền thanh toán từ client.
    - Không lưu PAN, CVV, mật khẩu ngân hàng hoặc thông tin đăng nhập ví.
    - Việc gọi nhà cung cấp diễn ra ngoài transaction cơ sở dữ liệu.
    - Khi nhận kết quả, mở transaction mới và kiểm tra lại trạng thái liên quan.
    - Worker phải kiểm tra quyền thực thi job và trạng thái attempt trước khi gửi.
    - Khi đã có SUCCESS hoặc requiresReview=true, không phát thêm yêu cầu thu tiền.
    - Với yêu cầu đã gửi ra ngoài, không được giả định có thể thu hồi;
      phải theo dõi kết quả và đối soát.

    8. Phân quyền
    - CUSTOMER chỉ truy cập thanh toán của chính mình.
    - DRIVER chỉ xem thanh toán và xác nhận tiền mặt của chuyến được giao.
    - OPERATOR được đọc dữ liệu để vận hành.
    - OPERATOR không được giả danh tài xế xác nhận đã nhận tiền mặt.
    - Sai vai trò trả 403.
    - Đúng vai trò nhưng đối tượng không thuộc phạm vi truy cập trả 404.
    - Không tiết lộ đối tượng có tồn tại hay không cho người không có quyền.
    - JWT phải được kiểm tra chữ ký, thuật toán cho phép, issuer, audience,
      thời hạn, session và trạng thái tài khoản.
    - JWT bị sửa hoặc session hết hiệu lực trả 401.

    9. Bảo mật và vận hành
    - Các response sử dụng Cache-Control: no-store.
    - API Gateway giới hạn tần suất các API công khai.
    - Webhook có chính sách giới hạn riêng phù hợp cơ chế retry của nhà cung cấp.
    - Query và thao tác dữ liệu phải được tham số hóa.
    - Chuỗi do client hoặc nhà cung cấp gửi không được thực thi như HTML/script.
    - Giao diện phải encode dữ liệu theo ngữ cảnh hiển thị.
    - Không ghi access token, chữ ký webhook, checkout token hoặc dữ liệu thẻ
      vào log thông thường.
    - Các thay đổi trạng thái thanh toán phải có audit và correlationId.
    - Doanh thu chỉ ghi nhận theo Payment SUCCESS và paidAt.
    - Không cộng doanh thu theo số callback hoặc số PaymentAttempt.

    10. Phần cần chốt trước khi tích hợp
    - Nhà cung cấp thanh toán và môi trường sandbox.
    - Cách tạo, tra cứu và xác minh giao dịch của nhà cung cấp.
    - Quy tắc idempotency của yêu cầu gửi sang nhà cung cấp.
    - Header/chữ ký, thuật toán xác minh và payload webhook.
    - Mã trạng thái nhà cung cấp được ánh xạ sang trạng thái CAB.
    - Nội dung acknowledgement và chính sách retry webhook.
    - Giới hạn số tiền, thời hạn checkout và quy trình xử lý đối soát.
    - Endpoint webhook trong tài liệu này là hợp đồng dự kiến,
      cần cụ thể hóa theo nhà cung cấp trước khi triển khai.

servers:
  - url: /v1
    description: API công khai thông qua API Gateway

tags:
  - name: Fare
    description: Cước cuối cùng của chuyến đi
  - name: Payment
    description: Tạo và đọc thanh toán
  - name: PaymentAttempt
    description: Lịch sử và thao tác trên các lần thanh toán
  - name: PaymentInternal
    description: Đối soát nội bộ CAB Core
  - name: PaymentWebhook
    description: Callback từ nhà cung cấp thanh toán

security:
  - bearerAuth: []

paths:
  /trips/{tripId}/fare:
    get:
      tags: [Fare]
      operationId: getTripFare
      summary: Lấy cước cuối cùng của chuyến đi
      description: |
        Cho phép CUSTOMER sở hữu chuyến, DRIVER được giao chuyến và OPERATOR.

        Đây là API chỉ đọc; GET không tự tạo hoặc tính lại Fare.

        Fare được tạo khi Trip COMPLETED và JourneyMetrics đã được xác nhận.
        Nếu sự kiện hoàn tất đã được ghi nhưng tác vụ tính cước chưa hoàn thành,
        trả FARE_NOT_READY.

        Công thức:
        - baseAmount = pricingSnapshot.baseFare.
        - distanceAmount = distanceKm * pricingSnapshot.pricePerKm.
        - timeAmount = durationMinutes * pricingSnapshot.pricePerMinute.
        - totalAmount = ROUND_HALF_UP(baseAmount + distanceAmount + timeAmount).

        durationMinutes được tính từ startedAt đến completedAt theo quy tắc
        JourneyMetrics đã chốt, không làm tròn lên từng phút một cách ngầm định.

        Các lỗi 409:
        - TRIP_NOT_COMPLETED: chuyến chưa hoàn tất.
        - FARE_NOT_READY: chưa có Fare cuối cùng.
        - FARE_REQUIRES_REVIEW: dữ liệu tính cước cần được kiểm tra.

        Trip bị CANCELLED hoặc ERROR đã đóng không được coi là COMPLETED.
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Cước cuối cùng đã được phát hành
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fare'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /trips/{tripId}/payments:
    post:
      tags: [Payment]
      operationId: createTripPayment
      summary: Tạo thanh toán cho chuyến đi
      description: |
        Chỉ CUSTOMER sở hữu chuyến được thực hiện.

        Điều kiện:
        - Trip COMPLETED.
        - Fare cuối cùng đã sẵn sàng và không cần kiểm tra lại.
        - Chưa có Payment cho Fare này.
        - Phương thức được yêu cầu có cấu hình hợp lệ và có thể sử dụng.

        Server lấy customerId, fareId, amount và currency từ dữ liệu đã xác nhận.
        Client không được truyền các trường này.

        Trong một transaction:
        - Tạo Payment.
        - Tạo PaymentAttempt đầu tiên, attemptNumber=1.
        - Thiết lập currentAttemptId.
        - Lưu kết quả idempotency.
        - Với thanh toán online, lưu job bền vững để bắt đầu xử lý.

        Response tạo mới là snapshot PENDING được lưu cùng transaction.
        Worker có thể cập nhật trạng thái ngay sau đó.
        Client sử dụng GET để đọc trạng thái hiện tại hoặc lấy checkout.

        Với CASH:
        - Payment và attempt ở PENDING.
        - Chờ tài xế được giao chuyến xác nhận đã nhận đủ tiền.

        Với thanh toán online:
        - Ghi merchantReference ổn định trước khi gửi yêu cầu ra ngoài.
        - Chuyển PROCESSING theo quá trình xử lý của adapter.
        - Không giữ transaction cơ sở dữ liệu trong lúc gọi nhà cung cấp.
        - Kết quả chưa chắc chắn phải được xử lý theo UNKNOWN và đối soát.

        Cùng Idempotency-Key và nội dung trả lại response 201 ban đầu.
        Đổi key không cho phép tạo Payment thứ hai cho cùng Fare.
        Nếu đã có Payment, client đọc Payment hiện có và chỉ dùng retry
        khi đủ điều kiện.

        Các lỗi 409:
        - TRIP_NOT_COMPLETED.
        - FARE_NOT_READY.
        - FARE_REQUIRES_REVIEW.
        - PAYMENT_ALREADY_EXISTS.
        - PAYMENT_METHOD_UNAVAILABLE.
        - IDEMPOTENCY_CONFLICT.
        - REQUEST_IN_PROGRESS.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: |
            Đã tạo Payment và attempt đầu tiên.
            Không có nghĩa đã thu tiền thành công.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              description: Đường dẫn đọc Payment vừa tạo
              schema:
                type: string
                example: /v1/payments/pay_001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /trips/{tripId}/payment:
    get:
      tags: [Payment]
      operationId: getPaymentByTrip
      summary: Lấy thanh toán theo chuyến đi
      description: |
        Cho phép CUSTOMER sở hữu chuyến, DRIVER được giao chuyến và OPERATOR.

        Dùng để tìm lại Payment khi client mất response tạo thanh toán.
        GET không tạo Payment, không tạo attempt và không gọi thu tiền.

        Kiểm tra quyền truy cập Trip trước khi kiểm tra Payment tồn tại.
        Trip ngoài phạm vi truy cập trả 404 TRIP_NOT_FOUND.
        Trip hợp lệ nhưng chưa có Payment trả 404 PAYMENT_NOT_FOUND.

        checkout chỉ xuất hiện với CUSTOMER sở hữu Payment khi đủ điều kiện.
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          $ref: '#/components/responses/PaymentReadSucceeded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TripPaymentNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /payments/{paymentId}:
    get:
      tags: [Payment]
      operationId: getPayment
      summary: Lấy trạng thái thanh toán hiện tại
      description: |
        Cho phép CUSTOMER sở hữu Payment, DRIVER được giao chuyến và OPERATOR.

        GET chỉ đọc dữ liệu, không khởi tạo hoặc gửi lại yêu cầu thu tiền.

        checkout chỉ trả cho CUSTOMER sở hữu Payment khi:
        - Thuộc currentAttemptId.
        - Attempt là thanh toán online.
        - Trạng thái cho phép tiếp tục checkout.
        - Liên kết còn hiệu lực.
        - requiresReview=false.
        - Payment chưa SUCCESS.

        DRIVER và OPERATOR không nhận checkout.
        Browser redirect không được sử dụng để cập nhật SUCCESS.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          $ref: '#/components/responses/PaymentReadSucceeded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PaymentNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /payments/{paymentId}/attempts:
    get:
      tags: [PaymentAttempt]
      operationId: listPaymentAttempts
      summary: Xem các lần thanh toán của một Payment
      description: |
        Cho phép CUSTOMER sở hữu Payment và OPERATOR.
        DRIVER không được truy cập endpoint này.

        Sắp xếp theo attemptNumber tăng dần.
        Cursor gắn với người gọi, paymentId và limit.
        Cursor không hợp lệ hoặc hết hạn trả 400.
        Không nhận query parameter ngoài hợp đồng.

        Danh sách không phải snapshot bất biến:
        trạng thái attempt có thể thay đổi giữa các lần đọc.
        Attempt mới được thêm với attemptNumber tăng dần.

        Không trả raw webhook, chữ ký, bí mật nhà cung cấp, dữ liệu thẻ,
        checkout token hoặc payload chứa dữ liệu nhạy cảm.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Danh sách các lần thanh toán
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttemptPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PaymentNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /payments/{paymentId}/confirm-cash:
    post:
      tags: [PaymentAttempt]
      operationId: confirmCashPayment
      summary: Tài xế xác nhận đã nhận đủ tiền mặt
      description: |
        Chỉ DRIVER được giao Trip của Payment được thực hiện.
        CUSTOMER và OPERATOR trả 403.

        Tài xế chỉ xác nhận sau khi thực tế đã nhận đủ tiền.
        Không nhận amount hoặc confirmedByAccountId từ request.

        Điều kiện cho lần xác nhận mới:
        - Trip COMPLETED.
        - Payment.method=CASH.
        - Payment.paymentStatus=PENDING.
        - Current attempt có method=CASH và status=PENDING.
        - requiresReview=false.
        - expectedVersion bằng version hiện tại.

        Trong một transaction:
        - Kiểm tra và khóa dữ liệu liên quan.
        - Cập nhật attempt thành SUCCESS.
        - Cập nhật Payment thành SUCCESS.
        - Ghi paidAt và confirmedByAccountId từ tài khoản đăng nhập.
        - Tăng Payment.version.
        - Ghi audit, outbox và kết quả idempotency.

        Không yêu cầu tài xế đang AVAILABLE.
        Tài xế có thể đang thực hiện chuyến khác khi xác nhận khoản tiền
        đã nhận của chuyến đã hoàn tất.
        Thao tác này không đổi trạng thái tài xế, Trip hoặc CustomerActivityGuard.

        Replay cùng key trả lại kết quả đã lưu và không phát thêm sự kiện.
        Key mới khi Payment đã SUCCESS trả PAYMENT_ALREADY_PAID.

        Các lỗi 409:
        - PAYMENT_VERSION_CONFLICT.
        - PAYMENT_ALREADY_PAID.
        - PAYMENT_NOT_CASH.
        - PAYMENT_NOT_PENDING.
        - PAYMENT_REQUIRES_REVIEW.
        - IDEMPOTENCY_CONFLICT.
        - REQUEST_IN_PROGRESS.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmCashRequest'
      responses:
        '200':
          description: Đã ghi nhận nhận đủ tiền mặt hoặc replay kết quả đã lưu
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashPaymentSucceeded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PaymentNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /payments/{paymentId}/retry:
    post:
      tags: [PaymentAttempt]
      operationId: retryPayment
      summary: Tạo lần thanh toán tiếp theo sau thất bại đã xác định
      description: |
        Chỉ CUSTOMER sở hữu Payment được thực hiện.

        Điều kiện:
        - Payment.paymentStatus=FAILED.
        - Attempt trước có bằng chứng thất bại cuối cùng.
        - Không còn attempt đang xử lý hoặc chưa rõ kết quả.
        - requiresReview=false.
        - expectedVersion bằng version hiện tại.
        - Phương thức mới có thể sử dụng.

        Không cho phép retry khi Payment ở PENDING, PROCESSING, UNKNOWN hoặc SUCCESS.
        Không đổi sang CASH để bỏ qua một giao dịch online chưa rõ kết quả.

        Có thể chọn lại phương thức, kể cả CASH, sau khi đáp ứng đầy đủ
        điều kiện thất bại cuối cùng.

        Trong một transaction:
        - Giữ nguyên Payment, Fare, amount và currency.
        - Tạo attempt mới với attemptNumber tăng một.
        - Cập nhật currentAttemptId và method theo attempt mới.
        - Đặt Payment về PENDING và tăng version.
        - Giữ nguyên lịch sử các attempt trước.
        - Lưu job nếu phương thức mới là thanh toán online.
        - Lưu kết quả idempotency.

        Response 202 là snapshot sau khi tạo attempt mới.
        Worker xử lý tiếp sau transaction.
        Replay cùng key không tạo thêm attempt hoặc job.

        Các lỗi 409:
        - PAYMENT_VERSION_CONFLICT.
        - PAYMENT_NOT_RETRYABLE.
        - PAYMENT_REQUIRES_RECONCILIATION.
        - PAYMENT_REQUIRES_REVIEW.
        - PAYMENT_METHOD_UNAVAILABLE.
        - IDEMPOTENCY_CONFLICT.
        - REQUEST_IN_PROGRESS.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryPaymentRequest'
      responses:
        '202':
          description: Đã tạo attempt mới, chưa xác nhận thanh toán thành công
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PaymentNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /payments/{paymentId}/reconcile:
    post:
      tags: [PaymentInternal]
      operationId: reconcilePayment
      summary: Đối soát kết quả thanh toán online
      x-internal: true
      servers:
        - url: http://{coreHost}:{corePort}/v1
          description: |
            Địa chỉ nội bộ dự kiến của CAB Core.
            Tên host và port phải khớp cấu hình Docker Compose thực tế.
          variables:
            coreHost:
              default: cab-core-api
            corePort:
              default: '3000'
      security:
        - serviceBearer: []
      description: |
        Chỉ danh tính dịch vụ nội bộ có scope payment:reconcile được thực hiện.
        User JWT không được thay thế service JWT.
        Gateway phải chặn route này; x-internal không tự thực thi việc chặn.

        Endpoint không nhận request body.
        Không nhận status, amount, providerTransactionId hoặc kết quả đối soát
        do người dùng tự cung cấp.

        Được dùng khi:
        - Payment hoặc attempt có trạng thái UNKNOWN.
        - Thanh toán online PROCESSING cần kiểm tra kết quả.
        - Có requiresReview và có dữ liệu giao dịch cần đối chiếu.

        Tra cứu dựa trên các reference đã lưu của PaymentAttempt.
        Nếu có kết quả mâu thuẫn giữa nhiều attempt, phải kiểm tra các attempt
        liên quan, không chỉ nhìn currentAttemptId.

        Quy trình:
        - Đọc thông tin giao dịch cần đối soát.
        - Gọi API tra cứu của nhà cung cấp ngoài transaction cơ sở dữ liệu.
        - Xác minh merchant, reference, amount, currency và kết quả.
        - Mở transaction và kiểm tra lại dữ liệu hiện tại.
        - Áp dụng kết quả hợp lệ mà không ghi đè callback mới hơn hoặc SUCCESS.
        - Ghi audit và outbox nếu có thay đổi nghiệp vụ.

        Không tìm thấy giao dịch hoặc timeout chỉ được coi là FAILED
        nếu hợp đồng nhà cung cấp đủ cơ sở khẳng định không thể thu tiền.
        Nếu chưa đủ cơ sở, giữ hoặc chuyển UNKNOWN.

        Không tạo attempt, không gửi yêu cầu thu tiền và không tự hoàn tiền.
        Không tự xóa requiresReview khi vẫn còn mâu thuẫn chưa giải quyết.
        Response không chứa checkout.

        Có thể trả 200 nhưng kết quả vẫn UNKNOWN hoặc requiresReview=true.
        200 chỉ xác nhận lần đối soát đã được xử lý.

        Các lỗi 409:
        - PAYMENT_NOT_RECONCILABLE.
        - REQUEST_IN_PROGRESS.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          $ref: '#/components/responses/PaymentReadSucceeded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ServiceUnauthenticated'
        '403':
          $ref: '#/components/responses/ServiceForbidden'
        '404':
          $ref: '#/components/responses/PaymentNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /payments/webhooks/{provider}:
    post:
      tags: [PaymentWebhook]
      operationId: receivePaymentWebhook
      summary: Nhận kết quả từ nhà cung cấp thanh toán
      security: []
      x-provider-contract-status: pending-provider-selection
      description: |
        Callback đi từ nhà cung cấp qua API Gateway đến CAB Core.

        security=[] chỉ bỏ yêu cầu user Bearer JWT.
        Endpoint vẫn bắt buộc xác thực theo cơ chế chữ ký của nhà cung cấp.

        HỢP ĐỒNG DỰ KIẾN:
        POST, application/json và các HTTP response dưới đây là khung thiết kế.
        Phải cập nhật theo tài liệu nhà cung cấp được chọn trước khi tích hợp.
        Không giả định mọi nhà cung cấp dùng cùng header, thuật toán, payload
        hoặc nội dung acknowledgement.

        Yêu cầu bắt buộc:
        - Chỉ chấp nhận provider đã cấu hình trong allowlist.
        - Thiếu cấu hình xác minh phải từ chối xử lý, không bỏ qua chữ ký.
        - Gateway và server giữ nguyên dữ liệu gốc cần cho việc xác minh chữ ký.
        - Xác minh chữ ký trước khi tin tưởng hoặc áp dụng nội dung callback.
        - Kiểm tra merchant/account nhận tiền theo cấu hình server.
        - Liên kết callback với attempt qua merchantReference đã lưu.
        - Đối chiếu amount, currency và provider transaction reference.
        - Không tin paymentId do payload cung cấp một cách độc lập.

        Chống xử lý trùng:
        - Sử dụng định danh sự kiện ổn định theo hợp đồng nhà cung cấp.
        - Nếu không có event ID, adapter phải định nghĩa khóa dedupe phù hợp.
        - Lưu dấu vết payload để phát hiện cùng event ID nhưng nội dung mâu thuẫn.
        - Chỉ ghi dedupe sau khi đã xác minh; payload giả không được chiếm khóa.
        - Bổ sung ràng buộc giao dịch và chuyển trạng thái nghiệp vụ.
        - Callback lặp hợp lệ được acknowledgement nhưng không thu tiền,
          không tăng version và không phát lại PaymentSucceeded.
        - Một provider transaction không được gán cho nhiều attempt.

        Ghi nhận kết quả:
        - Cập nhật PaymentAttempt, Payment, audit và outbox trong transaction.
        - SUCCESS chỉ được ghi nhận sau khi kết quả đã được xác minh đầy đủ.
        - FAILED chỉ dùng cho kết quả thất bại cuối cùng.
        - Callback đang chờ xử lý không được làm SUCCESS bị hạ trạng thái.
        - Thứ tự nhận callback không tự chứng minh thứ tự trạng thái nghiệp vụ.
        - Kết quả mâu thuẫn phải được lưu làm bằng chứng và chuyển kiểm tra.

        Callback đến muộn:
        - Nếu attempt cũ báo SUCCESS sau khi đã tồn tại attempt mới,
          lưu kết quả đã xác minh của attempt cũ và đặt requiresReview=true.
        - Nếu Payment đã SUCCESS, giữ SUCCESS.
        - Nếu Payment chưa SUCCESS và chưa thể kết luận trạng thái tổng hợp,
          đặt UNKNOWN trong khi xử lý đối soát.
        - Dừng các job thu tiền chưa phát đi của Payment đó.
        - Yêu cầu đã gửi sang nhà cung cấp vẫn phải được theo dõi kết quả.
        - Không tự gửi thêm giao dịch, không tự hoàn tiền và không xóa lịch sử.
        - Vấn đề thanh toán không được tạo TripIncident hoặc đổi Trip sang ERROR.

        Acknowledgement:
        - Chỉ xác nhận đã tiếp nhận sau khi callback hợp lệ đã được xử lý
          hoặc lưu bền vững vào inbox để worker xử lý tiếp.
        - Nếu dùng inbox, phải có retry, giám sát và khả năng phục hồi.
        - Không trả acknowledgement thành công khi chưa lưu được dữ liệu.
        - Callback giả hoặc sai chữ ký không được coi là đã tiếp nhận hợp lệ.
        - Mã HTTP và body cuối cùng phải theo hợp đồng nhà cung cấp.

        Rate limit webhook phải tách khỏi hạn mức thao tác của CUSTOMER.
        Không trả thành công rồi bỏ callback vì vượt hạn mức.
      parameters:
        - name: provider
          in: path
          required: true
          description: Mã adapter thanh toán đã được cấu hình
          schema:
            type: string
            minLength: 1
            maxLength: 64
      requestBody:
        required: true
        description: |
          Payload dự kiến; thay bằng schema thực tế khi chọn nhà cung cấp.
          Schema mở không thay thế xác minh chữ ký và kiểm tra nghiệp vụ.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: |
            Callback hợp lệ đã được xử lý, lưu bền vững hoặc nhận diện trùng.
            Body acknowledgement sẽ được chốt theo nhà cung cấp.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          description: |
            Payload không hợp lệ hoặc thông tin giao dịch không khớp.
            Mã HTTP và body cụ thể cần khớp hợp đồng nhà cung cấp.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          description: |
            Không xác minh được chữ ký hoặc danh tính nguồn callback.
            Không áp dụng trạng thái thanh toán từ payload.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '404':
          description: |
            Provider chưa được hỗ trợ hoặc không tìm thấy giao dịch liên kết.
            Cách trả lời cuối cùng cần khớp hợp đồng nhà cung cấp.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '429':
          description: |
            Vượt hạn mức tiếp nhận webhook.
            Chưa acknowledgement thành công; nhà cung cấp cần gửi lại
            theo hợp đồng tích hợp.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '503':
          description: |
            Tạm thời không thể xác minh hoặc lưu bền vững callback.
            Không trả acknowledgement thành công.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token của CUSTOMER, DRIVER hoặc OPERATOR.
        Kiểm tra chữ ký, issuer, audience, thời hạn và session.
        Tài khoản phải còn quyền sử dụng API tại thời điểm xử lý.

    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token danh tính dịch vụ nội bộ.
        Phải có audience dành cho CAB Core và scope payment:reconcile.
        Không chấp nhận user access token thay thế.

  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'

    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Khóa do client tạo cho một thao tác nghiệp vụ.

        Phạm vi gồm accountId, operation và resource.
        Cùng key và cùng nội dung trả lại status code cùng body đã lưu.
        Cùng key nhưng nội dung khác trả 409 IDEMPOTENCY_CONFLICT.
        Request cùng key đang xử lý trả 409 REQUEST_IN_PROGRESS.

        Xác thực và phân quyền trước khi replay.
        Replay hợp lệ được kiểm tra trước expectedVersion và trạng thái hiện tại.
        Dùng GET nếu cần đọc trạng thái mới nhất.

        Bản ghi idempotency phải liên kết bền vững với kết quả nghiệp vụ.
        Không chỉ dùng cache tạm thời để bảo vệ giao dịch thanh toán.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Cursor không trong suốt do server phát hành.
        Không hợp lệ, khác phạm vi hoặc hết hạn trả 400.
      schema:
        type: string
        minLength: 1

  headers:
    NoStore:
      description: Không lưu cache dữ liệu thanh toán
      schema:
        type: string
        enum: [no-store]

    RetryAfter:
      description: Số giây tối thiểu nên chờ trước khi thử lại
      schema:
        type: integer
        minimum: 1

  schemas:
    Identifier:
      type: string
      minLength: 1
      description: Định danh do server cấp

    Version:
      type: integer
      format: int64
      minimum: 1
      description: Phiên bản dùng để kiểm soát cập nhật đồng thời

    Currency:
      type: string
      enum: [VND]

    PaymentMethod:
      type: string
      enum:
        - CASH
        - E_WALLET
        - CREDIT_CARD
      description: |
        Các loại phương thức của CAB.
        Server chỉ chấp nhận phương thức đã được cấu hình và có thể sử dụng.

    PaymentStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - SUCCESS
        - FAILED
        - UNKNOWN

    ReturnUrl:
      type: string
      format: uri
      description: |
        Địa chỉ giao diện để nhà cung cấp đưa người dùng quay về.
        Phải khớp allowlist origin và path do server cấu hình.
        Bắt buộc HTTPS ngoài môi trường phát triển local.
        Không phải webhook URL.
        Không chứa access token hoặc dữ liệu thanh toán nhạy cảm.
        Redirect đến URL này không chứng minh đã thanh toán thành công.

    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required:
        - paymentMethod
      properties:
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        returnUrl:
          $ref: '#/components/schemas/ReturnUrl'
      oneOf:
        - properties:
            paymentMethod:
              type: string
              enum: [CASH]
          not:
            required:
              - returnUrl
        - required:
            - returnUrl
          properties:
            paymentMethod:
              type: string
              enum: [E_WALLET, CREDIT_CARD]

    ConfirmCashRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'

    RetryPaymentRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - paymentMethod
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        returnUrl:
          $ref: '#/components/schemas/ReturnUrl'
      oneOf:
        - properties:
            paymentMethod:
              type: string
              enum: [CASH]
          not:
            required:
              - returnUrl
        - required:
            - returnUrl
          properties:
            paymentMethod:
              type: string
              enum: [E_WALLET, CREDIT_CARD]

    PricingSnapshot:
      type: object
      additionalProperties: false
      required:
        - currency
        - baseFare
        - pricePerKm
        - pricePerMinute
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        baseFare:
          type: number
          minimum: 0
          description: Giá mở cửa; xử lý bằng decimal phía server
        pricePerKm:
          type: number
          minimum: 0
          description: Giá mỗi km; xử lý bằng decimal phía server
        pricePerMinute:
          type: number
          minimum: 0
          description: Giá mỗi phút; xử lý bằng decimal phía server

    Fare:
      type: object
      additionalProperties: false
      required:
        - fareId
        - tripId
        - pricingVersionId
        - pricingSnapshot
        - metricsVersion
        - distanceKm
        - durationMinutes
        - baseAmount
        - distanceAmount
        - timeAmount
        - totalAmount
        - currency
        - calculatedAt
      properties:
        fareId:
          $ref: '#/components/schemas/Identifier'
        tripId:
          $ref: '#/components/schemas/Identifier'
        pricingVersionId:
          $ref: '#/components/schemas/Identifier'
        pricingSnapshot:
          $ref: '#/components/schemas/PricingSnapshot'
        metricsVersion:
          type: integer
          format: int64
          minimum: 1
          description: Phiên bản JourneyMetrics đã xác nhận được dùng tính cước
        distanceKm:
          type: number
          minimum: 0
          description: |
            Quãng đường thực tế đã xác nhận.
            Không thay bằng khoảng cách đường chim bay hoặc số 0 khi thiếu dữ liệu.
        durationMinutes:
          type: number
          minimum: 0
          description: |
            Thời gian tính cước theo JourneyMetrics từ startedAt đến completedAt.
            Không ngầm làm tròn lên số phút nguyên.
        baseAmount:
          type: number
          minimum: 0
        distanceAmount:
          type: number
          minimum: 0
        timeAmount:
          type: number
          minimum: 0
        totalAmount:
          type: integer
          format: int64
          minimum: 0
          description: Tổng cuối cùng đã làm tròn ROUND_HALF_UP đến một VND
        currency:
          $ref: '#/components/schemas/Currency'
        calculatedAt:
          type: string
          format: date-time
      description: |
        Snapshot cước cuối cùng, bất biến sau khi phát hành.
        Các thành phần tính bằng decimal chính xác phía server.
        Không tạo Fare giả khi dữ liệu hành trình chưa được xác nhận.

    Checkout:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - redirectUrl
      properties:
        attemptId:
          $ref: '#/components/schemas/Identifier'
        redirectUrl:
          type: string
          format: uri
          description: |
            URL checkout do adapter đã xác thực cung cấp.
            Server kiểm tra đích đến theo cấu hình nhà cung cấp.
            Chỉ trả cho CUSTOMER sở hữu Payment.
        expiresAt:
          type: string
          format: date-time
          description: |
            Có khi nhà cung cấp cho biết thời hạn liên kết.
            Liên kết hết hạn không tự chứng minh giao dịch FAILED.

    Payment:
      type: object
      additionalProperties: false
      required:
        - paymentId
        - tripId
        - fareId
        - customerId
        - amount
        - currency
        - method
        - paymentStatus
        - currentAttemptId
        - requiresReview
        - version
        - createdAt
        - updatedAt
      properties:
        paymentId:
          $ref: '#/components/schemas/Identifier'
        tripId:
          $ref: '#/components/schemas/Identifier'
        fareId:
          $ref: '#/components/schemas/Identifier'
        customerId:
          $ref: '#/components/schemas/Identifier'
        amount:
          type: integer
          format: int64
          minimum: 0
          description: |
            Sao chép từ Fare.totalAmount.
            Bất biến giữa các attempt của cùng Payment.
        currency:
          $ref: '#/components/schemas/Currency'
        method:
          $ref: '#/components/schemas/PaymentMethod'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        currentAttemptId:
          $ref: '#/components/schemas/Identifier'
        requiresReview:
          type: boolean
          description: |
            Có mâu thuẫn hoặc vấn đề cần kiểm tra.
            Khi true, chặn tạo attempt và xác nhận tiền mặt.
            Không làm Payment SUCCESS bị hạ trạng thái.
        version:
          $ref: '#/components/schemas/Version'
        checkout:
          $ref: '#/components/schemas/Checkout'
        paidAt:
          type: string
          format: date-time
          description: |
            Thời điểm thành công được xác lập từ bằng chứng đã xác minh.
            Với CASH là thời điểm server ghi nhận xác nhận nhận đủ tiền.
            Chỉ xuất hiện khi paymentStatus=SUCCESS.
        confirmedByAccountId:
          allOf:
            - $ref: '#/components/schemas/Identifier'
          description: |
            Tài khoản DRIVER xác nhận đã nhận tiền mặt.
            Chỉ có khi đã ghi nhận xác nhận tiền mặt hợp lệ.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      allOf:
        - oneOf:
            - required:
                - paidAt
              properties:
                paymentStatus:
                  type: string
                  enum: [SUCCESS]
              not:
                required:
                  - checkout
            - properties:
                paymentStatus:
                  type: string
                  enum: [PENDING, PROCESSING, FAILED, UNKNOWN]
              not:
                required:
                  - paidAt
      description: |
        method là phương thức của currentAttemptId.
        Lịch sử phương thức và kết quả từng lần nằm trong PaymentAttempt.

        checkout chỉ có với CUSTOMER sở hữu Payment, khi current attempt
        còn cho phép thanh toán online, liên kết hợp lệ và requiresReview=false.
        Không trả checkout cho DRIVER, OPERATOR hoặc dịch vụ reconcile.
        Không trả checkout khi trạng thái FAILED hoặc UNKNOWN.

        Callback mâu thuẫn giữa các attempt phải giữ bằng chứng và đặt
        requiresReview; không suy luận khoản thu thực tế chỉ từ method hiện tại.
        Các trường tùy chọn không có giá trị phải được bỏ khỏi response.

    CashPaymentSucceeded:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required:
            - paidAt
            - confirmedByAccountId
          properties:
            method:
              type: string
              enum: [CASH]
            paymentStatus:
              type: string
              enum: [SUCCESS]
          not:
            required:
              - checkout

    PaymentAttempt:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - paymentId
        - attemptNumber
        - method
        - amount
        - currency
        - status
        - createdAt
        - updatedAt
      properties:
        attemptId:
          $ref: '#/components/schemas/Identifier'
        paymentId:
          $ref: '#/components/schemas/Identifier'
        attemptNumber:
          type: integer
          minimum: 1
          description: Thứ tự tăng dần, duy nhất trong một Payment
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        provider:
          type: string
          minLength: 1
          description: Chỉ áp dụng cho thanh toán online
        merchantReference:
          type: string
          minLength: 1
          description: |
            Reference duy nhất trong phạm vi merchant và provider.
            Được server tạo và lưu trước khi gửi yêu cầu thanh toán.
            Không thay reference để gửi lại một giao dịch chưa rõ kết quả.
        providerTransactionId:
          type: string
          minLength: 1
          description: |
            Mã giao dịch đã được xác minh từ nhà cung cấp.
            Có khi nhà cung cấp đã cấp mã.
            Không được liên kết cùng một giao dịch với nhiều attempt.
        failureCode:
          type: string
          description: Mã lỗi đã chuẩn hóa, không chứa dữ liệu nhạy cảm
        failureMessage:
          type: string
          description: Nội dung an toàn để hiển thị, không chứa raw provider payload
        confirmedByAccountId:
          allOf:
            - $ref: '#/components/schemas/Identifier'
          description: Có với attempt CASH đã được xác nhận nhận đủ tiền
        resolvedAt:
          type: string
          format: date-time
          description: Có khi attempt đã xác định SUCCESS hoặc FAILED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      allOf:
        - oneOf:
            - required:
                - resolvedAt
              properties:
                status:
                  type: string
                  enum: [SUCCESS, FAILED]
            - properties:
                status:
                  type: string
                  enum: [PENDING, PROCESSING, UNKNOWN]
              not:
                required:
                  - resolvedAt
      description: |
        method, amount và currency bất biến sau khi tạo attempt.
        Không xóa attempt cũ khi retry.
        CASH không có provider, merchantReference hoặc providerTransactionId.
        Với online, provider và merchantReference phải được lưu trước khi gọi ra ngoài.
        UNKNOWN không phải kết quả thất bại cuối cùng.
        Kết quả mâu thuẫn phải có audit và bằng chứng; không âm thầm ghi đè lịch sử.

    PaymentAttemptPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAttempt'
        nextCursor:
          type: string
          nullable: true
          description: null khi không còn trang tiếp theo tại thời điểm truy vấn

    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - errorCode
        - message
        - correlationId
      properties:
        errorCode:
          type: string
        message:
          type: string
          description: Thông báo an toàn, không lộ stack trace hoặc bí mật
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        correlationId:
          type: string
          description: Mã dùng để tra cứu log và audit liên quan

  responses:
    PaymentReadSucceeded:
      description: |
        Snapshot Payment hiện tại.
        checkout được lọc theo quyền và điều kiện nghiệp vụ.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Payment'

    BadRequest:
      description: |
        Request không hợp lệ.
        errorCode có thể là VALIDATION_ERROR, RETURN_URL_NOT_ALLOWED,
        INVALID_CURSOR hoặc CURSOR_EXPIRED.
        Không chấp nhận trường request ngoài hợp đồng.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthenticated:
      description: |
        UNAUTHENTICATED.
        Thiếu token, token không hợp lệ, bị sửa, hết hạn hoặc session không còn hiệu lực.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: |
        FORBIDDEN.
        Vai trò hoặc trạng thái tài khoản không được phép thực hiện thao tác.
        Đúng vai trò nhưng đối tượng ngoài phạm vi truy cập sử dụng 404.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnauthenticated:
      description: |
        UNAUTHENTICATED_SERVICE.
        Thiếu hoặc không xác minh được danh tính dịch vụ nội bộ.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceForbidden:
      description: |
        FORBIDDEN_SERVICE.
        Danh tính dịch vụ không có scope payment:reconcile.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TripNotFound:
      description: |
        TRIP_NOT_FOUND.
        Trip không tồn tại hoặc nằm ngoài phạm vi truy cập.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    PaymentNotFound:
      description: |
        PAYMENT_NOT_FOUND.
        Payment không tồn tại hoặc nằm ngoài phạm vi truy cập.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TripPaymentNotFound:
      description: |
        TRIP_NOT_FOUND nếu Trip không tồn tại hoặc ngoài phạm vi truy cập.
        PAYMENT_NOT_FOUND nếu Trip được phép truy cập nhưng chưa có Payment.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: |
        Xung đột trạng thái, phiên bản hoặc idempotency.
        errorCode cụ thể được mô tả tại từng operation.
        Không tự đổi key hoặc tạo giao dịch mới khi chưa xác định kết quả cũ.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
      description: |
        RATE_LIMIT_EXCEEDED.
        Vượt hạn mức được cấu hình tại API Gateway.
        Nếu thử lại thao tác ghi, giữ nguyên Idempotency-Key và nội dung.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: |
        SERVICE_UNAVAILABLE.
        Tạm thời không thể hoàn thành thao tác hoặc xác định kết quả.

        HTTP 503 không chứng minh giao dịch thanh toán đã thất bại.
        Với thao tác ghi, thử lại cùng Idempotency-Key và nội dung,
        hoặc đọc Payment hiện có để xác định trạng thái.
        Không tạo key mới để bỏ qua giao dịch chưa rõ kết quả.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnexpectedError:
      description: |
        INTERNAL_ERROR.
        Lỗi không dự kiến; không trả stack trace hoặc bí mật hệ thống.
        Lỗi HTTP không tự xác định kết quả thu tiền ở nhà cung cấp.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
