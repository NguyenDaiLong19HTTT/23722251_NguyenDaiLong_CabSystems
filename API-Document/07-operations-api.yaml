  /operations/driver-applications/{applicationId}/review:
    post:
      tags:
        - Driver Applications
      operationId: reviewDriverApplication
      summary: Duyệt hoặc từ chối hồ sơ đăng ký tài xế
      description: >
        Chỉ OPERATOR.


        Điều kiện:

        - Application đang SUBMITTED.

        - expectedVersion khớp Application.version.

        - expectedDriverVersion khớp Driver.version.

        - Driver đang PENDING_APPROVAL, OFFLINE và chưa có phân công xe.

        - Driver không có Trip hoạt động.


        APPROVED:

        - Account của tài xế phải ACTIVE.

        - OPERATOR đã kiểm tra thông tin cá nhân, giấy phép và xe.

        - Nếu không truyền vehicleId, tạo Vehicle từ thông tin xe đã nộp.

        - Xe mới có vehicleStatus=ACTIVE.

        - Nếu biển số đã tồn tại, không tự gán xe đó; trả PLATE_ALREADY_EXISTS.

        - Để dùng xe đã tồn tại, truyền vehicleId và expectedVehicleVersion.

        - Xe được chọn phải ACTIVE, chưa phân công, không có Trip hoạt động.

        - Biển số chuẩn hóa và vehicleType phải khớp thông tin hồ sơ.

        - Cập nhật Application=APPROVED, Driver.approvalStatus=APPROVED.

        - Tạo VehicleAssignment trong cùng transaction.

        - Giữ Driver OFFLINE.

        - Ghi reviewedAt, reviewedByAccountId và outbox
          DRIVER_APPLICATION_APPROVED.

        REJECTED:

        - Bắt buộc rejectionReason an toàn để hiển thị cho người đăng ký.

        - Không nhận vehicleId hoặc expectedVehicleVersion.

        - Cập nhật Application=REJECTED, Driver.approvalStatus=REJECTED.

        - Driver giữ OFFLINE và không có phân công xe.

        - Không tự khóa Account.

        - Lưu rejectionReason trên kết quả xét duyệt và dữ liệu Driver tương ứng.

        - Ghi reviewedAt, reviewedByAccountId và outbox
          DRIVER_APPLICATION_REJECTED.

        Cả hai quyết định:

        - Tăng Application.version và Driver.version.

        - Ghi audit và kết quả idempotency cùng transaction.

        - Không commit một phần giữa Application, Driver và phân công xe.

        - Kiểm tra lại ràng buộc duy nhất và version khi khóa dữ liệu.

        - Concurrent review chỉ được có một quyết định thành công.


        Replay cùng key trả kết quả đã lưu.

        Key mới trên hồ sơ đã quyết định trả APPLICATION_ALREADY_REVIEWED.

        API này không mở lại hồ sơ đã APPROVED hoặc REJECTED.


        Toàn bộ review/Application/Driver/Vehicle/VehicleAssignment thuộc cab_driver nên giữ transaction cục
        bộ. Chỉ đưa hồ sơ đủ điều kiện cấp phát vào review; Identity xác nhận hoàn tất hoặc Driver có bằng
        chứng xác nhận tương ứng qua gRPC. Không thay Account/Session trong transaction review.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewApplicationRequest"
      responses:
        "200":
          description: Kết quả xét duyệt và các bản ghi liên quan
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReviewResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ServerError"
