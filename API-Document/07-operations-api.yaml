  /operations/accounts/{accountId}/status:
    patch:
      tags:
        - Accounts
      operationId: changeOperationalAccountStatus
      summary: Thay đổi trạng thái tài khoản khách hàng hoặc tài xế
      description: >
        Chỉ OPERATOR. Không áp dụng cho tài khoản OPERATOR.

        Chỉ thay accountStatus; không đổi role hoặc thông tin đăng nhập.


        INACTIVE hoặc SUSPENDED:

        - Thu hồi toàn bộ Session.

        - Chặn request mới sử dụng Session đã thu hồi.

        - Ghi outbox AccountStatusChanged; Driver/Booking nhận để ngăn phân công mới và vô hiệu offer.

        - Tiếp tục điều phối Booking liên quan nếu còn điều kiện.

        - Driver không có Trip hoạt động chuyển OFFLINE.

        - Driver có Trip hoạt động giữ BUSY.

        - Không tự chuyển Booking hoặc Trip thành CANCELLED, ERROR hay COMPLETED.

        - Không tự giải phóng CustomerActivityGuard của công việc chưa đóng.


        ACTIVE:

        - Không khôi phục Session cũ.

        - Không tự duyệt hồ sơ, kích hoạt xe hoặc chuyển Driver AVAILABLE.


        Account và thu hồi Session commit nguyên tử tại Identity. MS khác xác minh quyền hiện tại qua gRPC
        trước bước nhạy cảm; event không bảo đảm atomic xuyên DB. Chính sách lệnh đã được cấp quyền nhưng chưa
        commit khi khóa Account xảy ra thuộc D07 phải chốt; không tuyên bố đã giải quyết chỉ bằng outbox.


        Nếu trạng thái đã đúng, kiểm tra expectedVersion rồi trả 200,

        không tăng version hoặc lặp tác dụng phụ.


        Trả công việc đang hoạt động để OPERATOR xử lý bằng API nghiệp vụ.


        200 xác nhận Identity đã commit Account/Session/outbox, không khẳng định Driver/Booking đã xử lý mọi
        tác dụng phụ. Danh sách công việc lấy qua gRPC Booking/Trip theo quyền; không join DB. Nếu không lấy
        được đầy đủ thì workLookupStatus=UNAVAILABLE và cả hai mảng là null, không giả mảng rỗng. checkedAt là
        thời điểm lần thu thập, không snapshot atomic nhiều MS. Replay trả snapshot đã lưu; dùng API đọc tương
        ứng lấy hiện trạng. Worker phục hồi event, không rollback khóa vì tra cứu công việc lỗi.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountStatusChangeRequest"
      responses:
        "200":
          description: Tài khoản và công việc liên quan sau thao tác
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatusChangeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
