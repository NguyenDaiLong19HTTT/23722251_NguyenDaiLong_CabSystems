openapi: 3.0.3
info:
  title: CAB System - Operations (Admin) API
  description: >
    API dành cho nhân viên vận hành quản lý khách hàng, tài xế, phương tiện,
    chuyến đi và giám sát/xử lý sự cố. Tương ứng FR14, FR15, BR06, BRu09,
    BRu10, BP05, UC09, AC08.
  version: "1.0.0"
servers:
  - url: https://api.cabsystem.example.com/v1
tags:
  - name: AdminCustomer
  - name: AdminDriver
  - name: AdminVehicle
  - name: AdminTrip

paths:
  /admin/customers:
    get:
      tags: [AdminCustomer]
      summary: Danh sách khách hàng
      description: FR14 - Nhân viên vận hành quản lý thông tin khách hàng.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Danh sách khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCustomers'
        '403':
          description: Không có quyền truy cập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/customers/{customerId}/status:
    patch:
      tags: [AdminCustomer]
      summary: Cập nhật trạng thái tài khoản khách hàng
      description: BRu09 - Thao tác quản trị phải được kiểm soát quyền truy cập.
      security:
        - bearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountStatus:
                  type: string
                  enum: [ACTIVE, INACTIVE, SUSPENDED]
      responses:
        '200':
          description: Cập nhật thành công
        '403':
          description: Không có quyền thực hiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/drivers:
    get:
      tags: [AdminDriver]
      summary: Danh sách tài xế
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [AVAILABLE, BUSY, OFFLINE]
      responses:
        '200':
          description: Danh sách tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDrivers'

  /admin/drivers/{driverId}/status:
    get:
      tags: [AdminDriver]
      summary: Kiểm tra trạng thái tài xế
      description: FR15 - Nhân viên vận hành kiểm tra trạng thái tài xế.
      security:
        - bearerAuth: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trạng thái tài xế hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '404':
          description: Không tìm thấy tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/vehicles:
    get:
      tags: [AdminVehicle]
      summary: Danh sách phương tiện
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Danh sách phương tiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedVehicles'

  /admin/trips:
    get:
      tags: [AdminTrip]
      summary: Danh sách chuyến đi
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Danh sách chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTrips'

  /admin/trips/active:
    get:
      tags: [AdminTrip]
      summary: Danh sách chuyến đang diễn ra
      description: FR15 - Nhân viên vận hành xem các chuyến đang diễn ra.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách chuyến đang diễn ra (thời gian thực)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveTripSummary'

  /admin/trips/{tripId}/incidents:
    post:
      tags: [AdminTrip]
      summary: Ghi nhận và xử lý sự cố cho một chuyến
      description: >
        FR15, BRu10 - Hỗ trợ xử lý các trường hợp chuyến bị lỗi; các thao tác
        quan trọng phải được lưu vết.
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issueType, description]
              properties:
                issueType:
                  type: string
                  example: "DRIVER_UNREACHABLE"
                description:
                  type: string
                resolution:
                  type: string
      responses:
        '201':
          description: Sự cố được ghi nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '403':
          description: Không có quyền thực hiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 20

  schemas:
    Customer:
      type: object
      properties:
        customerId:
          type: string
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
        accountStatus:
          type: string

    Driver:
      type: object
      properties:
        driverId:
          type: string
        fullName:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [AVAILABLE, BUSY, OFFLINE]
        currentLocation:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number

    Vehicle:
      type: object
      properties:
        vehicleId:
          type: string
        licensePlate:
          type: string
        vehicleType:
          type: string
        status:
          type: string
        driverId:
          type: string

    Trip:
      type: object
      properties:
        tripId:
          type: string
        customerId:
          type: string
        driverId:
          type: string
        status:
          type: string
        fare:
          type: number

    ActiveTripSummary:
      type: object
      properties:
        tripId:
          type: string
        customerName:
          type: string
        driverName:
          type: string
        status:
          type: string
        currentLocation:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number

    Incident:
      type: object
      properties:
        incidentId:
          type: string
        tripId:
          type: string
        issueType:
          type: string
        description:
          type: string
        resolution:
          type: string
        handledBy:
          type: string
        createdAt:
          type: string
          format: date-time

    PagedCustomers:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    PagedDrivers:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Driver'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    PagedVehicles:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    PagedTrips:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
