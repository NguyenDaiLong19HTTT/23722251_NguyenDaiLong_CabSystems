        correlationId:
          type: string
    DriverRegistrationOperation:
      type: object
      additionalProperties: false
      required:
        - operationId
        - status
        - createdAt
        - updatedAt
      properties:
        operationId:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: string
          enum:
            - PROCESSING
            - SUCCEEDED
            - FAILED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/DriverRegistrationResult"
        error:
          $ref: "#/components/schemas/ErrorResponse"
      oneOf:
        - properties:
            status:
              enum:
                - PROCESSING
          not:
            anyOf:
              - required:
                  - result
              - required:
                  - error
        - properties:
            status:
              enum:
                - SUCCEEDED
          required:
            - result
          not:
            required:
              - error
        - properties:
            status:
              enum:
                - FAILED
          required:
            - error
          not:
            required:
              - result
