  /operations/trips/{tripId}/resolve-error:
    post:
      tags:
        - Operations
      operationId: resolveTripError
      summary: Khôi phục hoặc đóng bất thường chuyến ERROR
      description: >
        Chỉ OPERATOR.

        Yêu cầu Trip ERROR, chưa có closedAt, expectedTripVersion khớp

        và có Incident OPEN cần giải quyết.

        OPERATOR phải kiểm tra toàn bộ Incident OPEN hiện tại.

        Bắt buộc resolutionNote.


        RESTORE_PREVIOUS_STATUS:

        - Chỉ khôi phục đúng statusBeforeError do server lưu.

        - Không nhận trạng thái đích từ client.

        - Account của Driver ACTIVE, hồ sơ APPROVED.

        - Xe của Trip và phân công còn hợp lệ.

        - Driver không có Trip hoạt động khác.

        - Giữ Driver BUSY và CustomerActivityGuard.

        - Không đặt lại arrivedAt, pickedUpAt hoặc startedAt.

        - Bỏ statusBeforeError khỏi trạng thái hiện tại sau khôi phục.

        - Ghi lịch sử chuyển trạng thái và outbox TRIP_RECOVERED.


        CLOSE_ABNORMALLY:

        - Giữ tripStatus=ERROR.

        - Ghi closedAt và closeReason từ resolutionNote.

        - Giữ statusBeforeError để truy vết.

        - Không tạo completedAt.

        - Không tự tạo Fare hoặc Payment cho chuyến gián đoạn.

        - Ghi ClosureOperation bền vững cùng transaction đóng Trip, sau đó worker gọi Customer/Driver giải
        phóng đúng tripId/version/generation.

        - Chỉ AVAILABLE nếu đáp ứng đầy đủ điều kiện hoạt động;
          trường hợp còn vấn đề về xe hoặc chưa đủ điều kiện thì OFFLINE.
        - Không coi việc đóng sự cố là bằng chứng xe đã được sửa.

        - Ghi audit đóng chuyến và outbox TRIP_CLOSED_ABNORMALLY.

        - Không tạo lịch sử ERROR -> ERROR chỉ để biểu diễn đóng chuyến.


        Trong cùng transaction cab_trip:

        - Tăng Trip.version.

        - Không cập nhật DB Driver; trạng thái Driver do Driver MS quản lý.

        - Chuyển toàn bộ Incident OPEN hiện tại sang RESOLVED.

        - Ghi cùng action, note, người xử lý và thời điểm cho các Incident.

        - Ghi audit, outbox và kết quả idempotency.


        Incident mới được tạo đồng thời làm thay đổi Trip.version,

        vì vậy request dùng version cũ phải bị từ chối.


        Replay cùng key trả snapshot kết quả cũ và không giải phóng

        guard hoặc Driver của một chuyến mới phát sinh sau đó.

        Key mới trên Trip đã khôi phục hoặc đóng trả TRIP_NOT_RESOLVABLE.


        RESTORE xác minh Account/Driver/xe/guard hiện hữu qua gRPC có thẩm quyền; không giải phóng khi ERROR
        chưa đóng. Không giữ transaction DB chờ RPC; kiểm tra Trip.version lúc commit. CLOSE_ABNORMALLY trả
        200 khi Trip/Incident/ClosureOperation đã commit, chưa chứng minh tài nguyên đã giải phóng. Theo dõi
        GET /trips/{tripId}/closure ở API 04. Driver chỉ AVAILABLE sau release an toàn, xe lỗi phải bị chặn
        trong transaction release tại Driver. Trường driver trong response là tùy chọn: bỏ khi không có
        snapshot xác minh, không dùng nó chứng minh release đã xong; tra cứu Driver riêng để lấy hiện trạng.
      parameters:
        - $ref: "#/components/parameters/TripId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveTripErrorRequest"
      responses:
        "200":
          description: Kết quả xử lý Trip và Incident liên quan
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveTripErrorResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ServerError"
      x-owner-service: trip-service
