        - Giữ unique constraint cho phân công đang hiệu lực.

        - Tăng Driver.version và version của các Vehicle có liên kết thay đổi.

        - Giữ Driver OFFLINE.

        - Không sửa Trip lịch sử.


        Liên kết đã đúng thì kiểm tra version và điều kiện rồi trả 200,

        không tăng version nếu không có thay đổi.


        Driver MS kiểm tra nguyên tử Driver/VehicleAssignment/Vehicle và reservation trong cab_driver. Không
        chỉ dựa BUSY hoặc đọc Trip cache: reservation đang giữ, đang gắn Trip hoặc chờ giải phóng đều ngăn
        thay đổi làm mất quyền của Saga/chuyến. Khi bị giữ trả 409 RESOURCE_RESERVED; không giải phóng bằng
        TTL. Account/Session kiểm tra qua Identity; D07 vẫn cần chốt với thao tác in-flight.
