        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ServerError"
      x-owner-service: payment-service
  /operations/reports/summary:
    get:
      tags:
        - Reports
      operationId: getOperationalSummary
      summary: Xem báo cáo vận hành cơ bản
      description: >
        NGOÀI MVP: giữ hợp đồng để truy vết FR22/UC16, không triển khai route trong baseline 8 MS. Không tạo
        Analytics MS thứ chín. Khi mở rộng phải duyệt mô hình tổng hợp/projection/watermark và phân quyền
        riêng; không query chéo DB hoặc giả snapshot atomic. Các định nghĩa chỉ số dưới đây là tham khảo lịch
        sử.


        Chỉ OPERATOR.

        Báo cáo cơ bản thuộc nhóm mở rộng của SRS.


        Khoảng [from, to), from < to và có thông tin múi giờ.


        totalTrips:

        - Trip có createdAt trong khoảng.


        completedTrips, cancelledTrips, abnormalClosedTrips:

        - Đếm trong cùng tập Trip có createdAt trong khoảng.

        - Dùng trạng thái trong snapshot cơ sở dữ liệu của báo cáo.

        - abnormalClosedTrips là ERROR có closedAt.


        cancellationRate = cancelledTrips / totalTrips.

        totalTrips=0 thì cancellationRate=null, không trả 0 giả định.


        noDriverFoundBookings:

        - Booking có createdAt trong khoảng và trạng thái NO_DRIVER_FOUND.

        - Không cộng vào tổng Trip hoặc số Trip bị hủy.


        successfulPayments và collectedRevenue:

        - Chỉ Payment SUCCESS có paidAt trong khoảng.

        - Mỗi Payment tính một lần, không đếm lại theo PaymentAttempt/callback.

        - CASH chỉ tính sau khi xác nhận nhận đủ tiền.

        - Không tính PENDING, PROCESSING, FAILED hoặc UNKNOWN.

        - Không phụ thuộc Trip được tạo trong khoảng nào.

        - Payment SUCCESS có requiresReview vẫn là bản ghi đã ghi nhận thu;
          cần theo dõi cờ review riêng, không tự đổi trạng thái hoặc trừ tiền.

        collectedRevenue là tiền ghi nhận đã thu, không phải lợi nhuận

        hoặc số dư đã quyết toán ngân hàng.


        Nếu triển khai sau MVP, phải đặc tả snapshotAt/watermark và độ trễ nguồn rõ ràng; không mặc định
        transaction đọc chung nhiều MS.

        Không đủ dữ liệu hoặc không tạo được snapshot thì trả lỗi,

        không thay dữ liệu thiếu bằng số 0.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Báo cáo trong khoảng yêu cầu
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ServerError"
      x-owner-service: outside-mvp
      x-scope: outside-mvp
      x-enabled-by-default: false
  /health:
    get:
      tags:
        - Health
      operationId: getGatewayLiveness
      summary: Kiểm tra API Gateway còn hoạt động
      servers:
        - url: /
          description: Route gốc của API Gateway, không có tiền tố /v1
      security: []
      description: |
        Liveness công khai.
        Trả 200 khi tiến trình Gateway có thể phục vụ probe.
        Không gọi toàn bộ dependency trong liveness.
        Không suy ra toàn bộ nghiệp vụ hoặc cơ sở dữ liệu đang sẵn sàng.
        Không trả cấu hình, host nội bộ, phiên bản secret hoặc stack trace.
      responses:
        "200":
          description: Gateway đang hoạt động
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - UP
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/ServerError"
      x-owner-service: gateway
  /ready:
    get:
      tags:
        - Health
      operationId: getSystemReadiness
      summary: Kiểm tra hệ thống sẵn sàng phục vụ theo cấu hình triển khai
      servers:
        - url: /
          description: Route gốc của API Gateway
      security: []
      description: >
        Trả trạng thái tối thiểu, không công khai chi tiết dependency.


        Kiểm tra các thành phần bắt buộc của bản triển khai:

        - Identity, Customer, Driver, Booking, Trip, Payment, Rating và Notification.

        - Worker bắt buộc của từng MS có heartbeat/progress đủ mới; không xem chỉ API sống là worker hoạt
        động.

        - Khả năng truy cập dữ liệu cần thiết của từng service.

        - Redis dùng cho rate limit.

        - RabbitMQ và đường xử lý sự kiện theo cấu hình.


        Mỗi probe có timeout và giới hạn tuổi kết quả.

        Không trả READY từ kết quả cũ quá giới hạn cho phép.

        Không kết nối được hoặc không xác định được dependency bắt buộc

        thì trả 503 NOT_READY.


        Các service cung cấp probe nội bộ; không mở thêm cổng công khai.

        Kiểm tra worker bằng tín hiệu hoạt động thực tế có thời hạn,

        không giả định worker là HTTP server.


        NOT_READY không bắt buộc handler mọi API ngừng phục vụ.

        Ví dụ hộp thư đã công bố vẫn có thể đọc nếu các dependency

        cần cho chính thao tác đọc vẫn hoạt động.
      responses:
        "200":
          description: Các thành phần bắt buộc đã sẵn sàng
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - READY
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Có thành phần bắt buộc chưa sẵn sàng hoặc chưa xác định được
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - NOT_READY
        default:
          $ref: "#/components/responses/ServerError"
      x-owner-service: gateway
  /health/services:
    get:
      tags:
        - Health
      operationId: getServiceHealthDetails
      summary: Điều hành viên xem sức khỏe các thành phần
      servers:
        - url: /
          description: Route gốc của API Gateway
      description: >
        Chỉ OPERATOR có tài khoản và session hợp lệ.


        Kiểm tra tối thiểu các thành phần:

        gateway, identity-service, customer-service, driver-service, booking-service, trip-service,
        payment-service, rating-service, notification-service, postgres, redis, rabbitmq.


        Trạng thái phản ánh probe thực tế, không hard-code UP.

        Probe database theo khả năng truy cập mà service thực sự cần.

        Không chỉ kiểm tra cổng PostgreSQL đang mở.

        Worker cần heartbeat hoặc bằng chứng xử lý còn hiệu lực.

        Timeout hoặc kết quả quá cũ phải thể hiện UNKNOWN hoặc DOWN.


        Mỗi thành phần có checkedAt riêng.

        Đây là tập quan sát trong một đợt kiểm tra, không phải snapshot

        nguyên tử của nhiều máy.


        Không trả password, connection string, token, host nhạy cảm

        hoặc raw exception.

        Dependency lỗi có thể trả 503 kèm báo cáo chi tiết này.

        Nếu không xác thực được OPERATOR thì không trả báo cáo chi tiết.


        Danh sách bắt buộc 12 thành phần theo enum mới; probe DB của mỗi MS qua readiness của MS, Gateway
        không đăng nhập trực tiếp DB nghiệp vụ. PostgreSQL chung vật lý không thay thế kiểm tra
        credential/schema từng DB logic. Worker có heartbeat và độ trễ công việc; probe quá hạn là
        UNKNOWN/DOWN, không UP từ cache cũ.
      responses:
        "200":
          description: Các thành phần bắt buộc đang hoạt động
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: |
            Có thành phần lỗi, chưa xác định được hoặc không thể hoàn tất kiểm tra.
            Nếu bước xác thực phụ thuộc dịch vụ đang lỗi, trả ErrorResponse
            thay vì dữ liệu sức khỏe chi tiết.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SystemHealth"
                  - $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/ServerError"
      x-owner-service: gateway
  /driver-registration-operations/{operationId}:
    get:
      tags:
        - Driver Applications
      operationId: getDriverRegistrationOperation
      x-owner-service: identity-service
      summary: Tra cứu tiến trình đăng ký Driver
      security:
        - driverRegistrationProof: []
      description: Không cần Session. Đối chiếu token digest và Idempotency-Key với operation; chỉ biết ID/key không
        đủ quyền. Token gốc hết hạn/đã tiêu thụ vẫn được dùng đọc đúng operation trong cửa sổ phục hồi, không
        khởi tạo operation mới. Thiếu proof trả 401; sai proof/key, mã không tồn tại hoặc hết lưu giữ đều trả
        404 giống nhau. Mất POST đầu thì replay cùng token/key/body để tìm lại ID. GET 200 là tra cứu, chỉ
        SUCCEEDED có kết quả đăng ký 201 đã lưu. PROCESSING không lộ hồ sơ từng phần. Đề xuất giữ operation
        đang chạy và thêm 7 ngày sau kết quả cuối; giữ tombstone/digest tối thiểu ngăn tái tạo key, D08 phải
        chốt dọn. Không lưu PII trong tombstone. Hết cửa sổ replay trả IDEMPOTENCY_KEY_EXPIRED, không mở lại
        token.
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Tiến trình đăng ký được phép đọc.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRegistrationOperation"
        "401":
          description: REGISTRATION_PROOF_REQUIRED.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: REGISTRATION_OPERATION_NOT_FOUND.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        User JWT đã xác minh, Account ACTIVE và Session hợp lệ.
        Role và accountId không lấy từ request body.
    driverRegistrationProof:
      type: apiKey
      in: header
      name: Driver-Registration-Token
      description: verificationToken gốc của đúng operation, dùng cùng Idempotency-Key gốc. Không phải JWT; không
        đưa vào URL/log. Chỉ tra cứu/replay operation đã tiếp nhận, không cấp quyền đăng ký mới sau hết hạn.
  headers:
    NoStore:
      description: Không lưu response vào bộ nhớ đệm
      schema:
        type: string
        enum:
          - no-store
    RetryAfter:
      description: Số giây tối thiểu nên chờ trước khi thử lại
      schema:
        type: integer
        minimum: 1
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Khóa ổn định của một thao tác.
        Gửi lại cùng thao tác phải giữ nguyên key và nội dung.
        Phạm vi và quy tắc replay được mô tả trong info và từng operation.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    DriverId:
      name: driverId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: |
        Cursor opaque gắn với người gọi, endpoint, bộ lọc và limit.
        Không hợp lệ hoặc hết hạn trả 400.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    OptionalFrom:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    OptionalTo:
      name: to
      in: query
      schema:
        type: string
        format: date-time
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
    Version:
      type: integer
      format: int64
      minimum: 1
    NonBlankText:
      type: string
      minLength: 1
      maxLength: 2000
      pattern: \S
    ReviewReason:
      type: string
      minLength: 1
      maxLength: 1000
      pattern: \S
      description: Lý do văn bản thuần, an toàn để thông báo cho người đăng ký
    Phone:
      type: string
      pattern: ^\+[1-9][0-9]{7,14}$
    LicenseNumber:
      type: string
      minLength: 1
      maxLength: 100
      pattern: \S
    AccountStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - SUSPENDED
    DriverApprovalStatus:
      type: string
      enum:
        - PENDING_APPROVAL
        - APPROVED
        - REJECTED
    ApplicationStatus:
      type: string
      enum:
        - SUBMITTED
        - APPROVED
        - REJECTED
    DriverStatus:
      type: string
      enum:
        - AVAILABLE
        - BUSY
        - OFFLINE
    VehicleStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    VehicleType:
      type: string
      enum:
        - STANDARD
        - PREMIUM
        - MOTORBIKE
        - VAN
    TripStatus:
      type: string
      enum:
        - DRIVER_ASSIGNED
        - ARRIVED_PICKUP
        - PICKED_UP
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
        - ERROR
    IncidentStatus:
      type: string
      enum:
        - OPEN
        - RESOLVED
    IncidentIssueType:
      type: string
      enum:
        - VEHICLE_BREAKDOWN
        - ACCIDENT
        - PASSENGER_ISSUE
        - OTHER
    ResolutionAction:
      type: string
      enum:
        - RESTORE_PREVIOUS_STATUS
        - CLOSE_ABNORMALLY
    PaymentStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - SUCCESS
        - FAILED
        - UNKNOWN
    PaymentMethod:
      type: string
      enum:
        - CASH
        - E_WALLET
        - CREDIT_CARD
    CreateVehicleRequest:
      type: object
      additionalProperties: false
      required:
        - plateNumber
        - vehicleType
      properties:
        plateNumber:
          type: string
          minLength: 1
          maxLength: 30
          pattern: \S
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
    SubmitDriverApplicationRequest:
      type: object
      additionalProperties: false
      required:
        - verificationToken
        - fullName
        - email
        - password
        - licenseNumber
        - vehicle
      properties:
        verificationToken:
          type: string
          minLength: 32
          writeOnly: true
          description: Token xác minh OTP, mục đích DRIVER_REGISTRATION
        fullName:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          pattern: \S
          description: Áp dụng chính sách mật khẩu API Auth; không trim hoặc ghi log
        licenseNumber:
          $ref: "#/components/schemas/LicenseNumber"
        vehicle:
          $ref: "#/components/schemas/CreateVehicleRequest"
    DriverRegistrationResult:
      type: object
      additionalProperties: false
      required:
        - accountId
        - driverId
        - applicationId
        - accountStatus
        - approvalStatus
        - driverStatus
        - applicationStatus
        - submittedAt
      properties:
        accountId:
          $ref: "#/components/schemas/Identifier"
        driverId:
          $ref: "#/components/schemas/Identifier"
        applicationId:
          $ref: "#/components/schemas/Identifier"
        accountStatus:
          type: string
          enum:
            - ACTIVE
        approvalStatus:
          type: string
          enum:
            - PENDING_APPROVAL
        driverStatus:
          type: string
          enum:
            - OFFLINE
        applicationStatus:
          type: string
          enum:
            - SUBMITTED
        submittedAt:
          type: string
          format: date-time
    ApplicantSnapshot:
      type: object
      additionalProperties: false
      required:
        - fullName
        - email
        - phone
        - phoneVerifiedAt
        - licenseNumber
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          $ref: "#/components/schemas/Phone"
        phoneVerifiedAt:
          type: string
          format: date-time
        licenseNumber:
          $ref: "#/components/schemas/LicenseNumber"
      description: |
        Snapshot tại lúc nộp hồ sơ; dữ liệu nhạy cảm được mã hóa khi lưu.
        PhoneVerifiedAt chỉ xác nhận phone trong snapshot đã qua OTP.
        Không tự chứng minh một phone mới được sửa sau này cũng đã xác minh.
    DriverApplication:
      type: object
      additionalProperties: false
      required:
        - applicationId
        - accountId
        - driverId
        - status
        - applicant
        - submittedVehicle
        - version
        - submittedAt
        - updatedAt
      properties:
        applicationId:
          $ref: "#/components/schemas/Identifier"
        accountId:
          $ref: "#/components/schemas/Identifier"
        driverId:
          $ref: "#/components/schemas/Identifier"
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        applicant:
          $ref: "#/components/schemas/ApplicantSnapshot"
        submittedVehicle:
          $ref: "#/components/schemas/CreateVehicleRequest"
        version:
          $ref: "#/components/schemas/Version"
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
        reviewedByAccountId:
          $ref: "#/components/schemas/Identifier"
        rejectionReason:
          $ref: "#/components/schemas/ReviewReason"
        approvedVehicleId:
          allOf:
            - $ref: "#/components/schemas/Identifier"
          description: Xe được ghi nhận tại lúc duyệt; không đổi theo phân công về sau
      oneOf:
        - properties:
            status:
              type: string
              enum:
                - SUBMITTED
          not:
            anyOf:
              - required:
                  - reviewedAt
              - required:
                  - reviewedByAccountId
              - required:
                  - rejectionReason
              - required:
                  - approvedVehicleId
        - required:
            - reviewedAt
            - reviewedByAccountId
            - approvedVehicleId
          properties:
            status:
              type: string
              enum:
                - APPROVED
          not:
            required:
              - rejectionReason
        - required:
            - reviewedAt
            - reviewedByAccountId
            - rejectionReason
          properties:
            status:
              type: string
              enum:
                - REJECTED
          not:
            required:
              - approvedVehicleId
    ReviewApplicationRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - expectedDriverVersion
        - decision
      properties:
        expectedVersion:
          $ref: "#/components/schemas/Version"
        expectedDriverVersion:
          $ref: "#/components/schemas/Version"
        decision:
          type: string
          enum:
            - APPROVED
            - REJECTED
        rejectionReason:
          $ref: "#/components/schemas/ReviewReason"
        vehicleId:
          $ref: "#/components/schemas/Identifier"
        expectedVehicleVersion:
          $ref: "#/components/schemas/Version"
      oneOf:
        - properties:
            decision:
              type: string
              enum:
                - APPROVED
          not:
            required:
              - rejectionReason
          oneOf:
            - required:
                - vehicleId
                - expectedVehicleVersion
            - not:
                anyOf:
                  - required:
                      - vehicleId
                  - required:
                      - expectedVehicleVersion
        - required:
            - rejectionReason
          properties:
            decision:
              type: string
              enum:
                - REJECTED
          not:
            anyOf:
              - required:
                  - vehicleId
              - required:
                  - expectedVehicleVersion
