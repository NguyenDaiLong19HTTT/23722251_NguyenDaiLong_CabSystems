    ServiceHealth:
      type: object
      additionalProperties: false
      required:
        - name
        - status
        - checkedAt
      properties:
        name:
          type: string
          enum:
            - gateway
            - identity-service
            - customer-service
            - driver-service
            - booking-service
            - trip-service
            - payment-service
            - rating-service
            - notification-service
            - postgres
            - redis
            - rabbitmq
        status:
          type: string
          enum:
            - UP
            - DOWN
            - UNKNOWN
        checkedAt:
          type: string
          format: date-time
          description: Thời điểm đánh giá, kể cả khi timeout hoặc chưa xác định được
        reasonCode:
          type: string
          enum:
            - CONNECTION_FAILED
            - TIMEOUT
            - DEPENDENCY_UNAVAILABLE
            - WORKER_HEARTBEAT_STALE
            - PROBE_FAILED
            - NOT_CHECKED
          description: Mã lỗi chuẩn hóa, không chứa raw exception
      description: |
        Mỗi name xuất hiện tối đa một lần trong SystemHealth.
        UP chỉ dùng khi kiểm tra đáp ứng điều kiện và còn đủ mới.
    SystemHealth:
      type: object
      additionalProperties: false
      required:
        - status
        - checkedAt
        - services
      properties:
        status:
          type: string
          enum:
            - UP
            - DEGRADED
        checkedAt:
          type: string
          format: date-time
        services:
          type: array
          minItems: 12
          maxItems: 12
          items:
            $ref: "#/components/schemas/ServiceHealth"
      description: >
        Bao gồm đủ 12 thành phần: Gateway, tám MS và PostgreSQL/Redis/RabbitMQ, mỗi name một lần. Worker bắt
        buộc gộp vào kết quả MS chủ sở hữu, không là MS mới.

        Có DOWN hoặc UNKNOWN ở thành phần bắt buộc thì status=DEGRADED.

        HTTP 200 chỉ khi status=UP; DEGRADED trả HTTP 503.

        Probe các thành phần không diễn ra nguyên tử.
