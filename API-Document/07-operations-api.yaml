            $ref: "#/components/schemas/Vehicle"
    BadRequest:
      description: |
        VALIDATION_ERROR, INVALID_CURSOR, CURSOR_EXPIRED,
        INVALID_TIME_RANGE hoặc VERIFICATION_TOKEN_INVALID_OR_EXPIRED.
        Không nhận trường request hoặc query ngoài hợp đồng.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: |
        UNAUTHENTICATED.
        Thiếu JWT, JWT không hợp lệ, hết hạn, bị sửa hoặc Session bị thu hồi.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: |
        FORBIDDEN hoặc ACCOUNT_INACTIVE.
        Sai vai trò hoặc tài khoản không được phép thực hiện thao tác.
        Không cho phép quản lý OPERATOR qua API tài khoản trong file này.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: |
        Không tìm thấy đối tượng hoặc đối tượng ngoài phạm vi truy cập.
        Mã lỗi theo tài nguyên như ACCOUNT_NOT_FOUND, DRIVER_NOT_FOUND,
        APPLICATION_NOT_FOUND, VEHICLE_NOT_FOUND hoặc TRIP_NOT_FOUND.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: >
        Xung đột version, dữ liệu duy nhất hoặc điều kiện nghiệp vụ.


        Các mã lỗi:

        - VERSION_CONFLICT.

        - IDEMPOTENCY_CONFLICT.

        - REQUEST_IN_PROGRESS.

        - CONTACT_ALREADY_EXISTS.

        - LICENSE_ALREADY_EXISTS.

        - PLATE_ALREADY_EXISTS.

        - VERIFICATION_TOKEN_USED.

        - APPLICATION_ALREADY_REVIEWED.

        - APPLICATION_NOT_REVIEWABLE.

        - DRIVER_HAS_ACTIVE_TRIP.

        - DRIVER_NOT_OFFLINE.

        - DRIVER_NOT_ELIGIBLE.

        - VEHICLE_HAS_ACTIVE_TRIP.

        - VEHICLE_ALREADY_ASSIGNED.

        - VEHICLE_NOT_ACTIVE.

        - VEHICLE_APPLICATION_MISMATCH.

        - LOCATION_STALE.

        - LOCATION_UNAVAILABLE.

        - TRIP_NOT_ACTIVE.

        - TRIP_NOT_RESOLVABLE.

        - PRICING_EFFECTIVE_TIME_CONFLICT.


        Không ghi đè dữ liệu mới hơn hoặc bỏ qua ràng buộc để tiếp tục.


        RESOURCE_RESERVED: tài nguyên đang được Saga/Trip giữ. REGISTRATION_FAILED: cấp phát đã thất bại cuối.
        IDEMPOTENCY_KEY_EXPIRED: hết cửa sổ replay, không tạo lại operation. Đăng ký Driver còn xử lý trả 202
        thay REQUEST_IN_PROGRESS.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: |
        RATE_LIMIT_EXCEEDED.
        Vượt hạn mức được cấu hình tại Gateway.
        Khi gửi lại thao tác ghi, giữ nguyên Idempotency-Key và nội dung.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: |
        SERVICE_UNAVAILABLE.
        Không thể hoàn thành thao tác do dependency cần thiết tạm thời lỗi.
        HTTP 503 không tự chứng minh transaction chưa commit.
        Nếu mất kết quả thao tác ghi, gửi lại cùng key và nội dung.
        Không tạo thao tác mới chỉ vì mất response.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: |
        INTERNAL_ERROR.
        Không trả stack trace, secret hoặc chuỗi kết nối.
        Client dùng cùng key và nội dung khi cần xác định kết quả thao tác ghi.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
