        - Tạo thêm Incident OPEN.

        - Giữ statusBeforeError.

        - Tăng Trip.version.

        - Không ghi ERROR -> ERROR hoặc phát lại TRIP_ERROR.


        Giữ Driver BUSY và CustomerActivityGuard của chuyến.

        reportedByAccountId lấy từ OPERATOR đăng nhập.

        Incident, Trip, audit và outbox commit cùng transaction.

        Không chuyển Trip đã đóng trở lại ERROR.

        Không dùng endpoint để thay Fare hoặc Payment.


        Incident/Trip/audit/outbox thuộc cùng cab_trip; giữ transaction này. Không phát lệnh giải phóng khi
        ERROR chưa đóng.
