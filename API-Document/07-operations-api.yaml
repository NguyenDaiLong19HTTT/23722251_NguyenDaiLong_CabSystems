openapi: 3.0.3
info:
  title: CAB System - Operations and Fleet API
  version: 1.3.0
  description: >
    API đăng ký tài xế, xét duyệt hồ sơ, vận hành và quản lý đội xe CAB System.


    1. Kiến trúc

    - Operations là nhóm API theo vai trò, không phải MS thứ chín.

    - Identity sở hữu Account/Session/OTP/RegistrationOperation; Driver sở hữu hồ sơ, xe và phân công.

    - Trip sở hữu chuyến và Incident; Payment sở hữu Pricing/Fare/Payment.

    - Gateway chuyển REST đến gRPC đúng chủ sở hữu; không ghi database nghiệp vụ.

    - Tám MS có database logic riêng; chỉ cập nhật nguyên tử trong DB của cùng chủ sở hữu.

    - x-owner-service chỉ mô tả trách nhiệm, không phải cấu hình routing thực thi.

    - Không truy vấn chéo cơ sở dữ liệu của các service để xử lý nghiệp vụ.

    - Thay đổi nghiệp vụ và outbox được ghi trong cùng transaction.

    - Worker từng MS chuyển outbox qua RabbitMQ; eventType/source theo API 06 v2.

    - Notification Service tiếp nhận sự kiện và tạo thông báo.

    - Lỗi gửi thông báo không đảo ngược kết quả nghiệp vụ đã commit.

    - Mọi HTTP request bên ngoài đi qua API Gateway.


    2. Phân quyền

    - /operations/* chỉ dành cho OPERATOR.

    - /drivers/me và /drivers/me/availability chỉ dành cho DRIVER.

    - POST /driver-applications là đăng ký công khai có verificationToken.

    - GET /driver-applications/me chỉ dành cho DRIVER sở hữu hồ sơ.

    - GET /drivers/{driverId} kiểm tra quyền theo quan hệ với tài xế.

    - /health và /ready công khai, chỉ trả trạng thái tối thiểu.

    - /health/services chỉ dành cho OPERATOR.

    - Không tạo hoặc quản lý tài khoản OPERATOR qua tài liệu này.

    - Không cho client tự đổi role.

    - JWT phải được kiểm tra chữ ký, thuật toán cho phép, issuer,
      audience, thời hạn, session và trạng thái tài khoản.
    - Token bị sửa hoặc session không hợp lệ trả 401.

    - Sai vai trò trả 403.

    - Đúng vai trò nhưng đối tượng ngoài phạm vi truy cập trả 404.


    3. Các nhóm trạng thái

    - Account: ACTIVE, INACTIVE, SUSPENDED.

    - Driver approvalStatus: PENDING_APPROVAL, APPROVED, REJECTED.

    - Driver driverStatus: AVAILABLE, BUSY, OFFLINE.

    - DriverApplication: SUBMITTED, APPROVED, REJECTED.

    - Vehicle: ACTIVE, INACTIVE.

    - Các trạng thái này có ý nghĩa riêng.


    4. Luồng đăng ký và duyệt tài xế

    - Người đăng ký xin và xác minh OTP qua API Auth.

    - API Auth cấp verificationToken có mục đích DRIVER_REGISTRATION.

    - POST /driver-applications sử dụng token đó để đăng ký.

    - Identity tạo Account và operation cục bộ; Driver tạo Driver PENDING_APPROVAL/OFFLINE
      cùng Application SUBMITTED trong transaction cab_driver. Identity xác nhận đủ hồ sơ rồi hoàn tất.
    - Chỉ khi cấp phát hoàn tất mới đăng nhập xem hồ sơ/thông báo; không tự cấp Session từ API đăng ký.

    - PENDING_APPROVAL hoặc REJECTED không tự làm Account mất quyền đăng nhập.

    - Chỉ hồ sơ APPROVED mới có thể đáp ứng điều kiện online và nhận chuyến.

    - Quyết định duyệt chỉ thực hiện qua API review DriverApplication.

    - Không duyệt bằng cách sửa trực tiếp Driver.approvalStatus.

    - Phiên bản này chỉ có một hồ sơ đăng ký ban đầu cho mỗi Driver.

    - Chỉnh sửa sau khi nộp, nộp lại hồ sơ bị từ chối và tái xét duyệt
      sau khi thay giấy phép chưa thuộc phạm vi API này.
    - Dùng trạng thái Account để chặn quyền khẩn cấp khi cần.


    5. Thông tin định danh và dữ liệu nhạy cảm

    - Email được trim và chuyển chữ thường.

    - Phone dùng E.164 theo API Auth.

    - Email và phone duy nhất trong toàn bộ Account.

    - licenseNumber được trim, chuyển chữ hoa và kiểm tra duy nhất.

    - Email, phone và licenseNumber được mã hóa khi lưu trữ.

    - Dùng HMAC lookup với khóa riêng để kiểm tra duy nhất theo giá trị chuẩn hóa.

    - Không giữ thêm cột plaintext để phục vụ tìm kiếm hoặc báo cáo.

    - Mật khẩu được hash bằng Argon2id, không mã hóa có thể giải ngược.

    - Khóa mã hóa, khóa HMAC và secret nằm ngoài repository.

    - Không trả password hash, OTP, verificationToken hoặc refresh token.

    - Chỉ giải mã dữ liệu cần thiết sau khi đã kiểm tra quyền.

    - Không ghi mật khẩu, token hoặc dữ liệu bí mật vào audit và log.


    6. Phân công xe

    - VehicleAssignment là nguồn dữ liệu chính của phân công hiện tại.

    - Driver.vehicleId và Vehicle.assignedDriverId là dữ liệu đọc suy ra.

    - Một Driver có tối đa một phân công xe đang hiệu lực.

    - Một Vehicle có tối đa một tài xế được phân công.

    - Ràng buộc vẫn giữ khi Driver OFFLINE hoặc Account bị khóa.

    - Thay phân công không thay vehicleId hoặc snapshot xe của Trip lịch sử.

    - Trip ERROR chưa đóng vẫn là chuyến đang hoạt động.


    7. Điều kiện AVAILABLE và nhận chuyến

    - Account ACTIVE.

    - Driver APPROVED.

    - Có VehicleAssignment hợp lệ và Vehicle ACTIVE.

    - Không có Trip đang hoạt động.

    - GPS hợp lệ và còn mới theo cấu hình dùng chung với Dispatch.

    - Ngưỡng GPS hiện tại là 30 giây tính từ recordedAt.

    - GPS nhận lại muộn không được làm mới tuổi của vị trí cũ.

    - Nhận chuyến còn phải kiểm tra loại xe, bán kính, Booking và TripRequest.

    - Client không được tự đặt BUSY.


    8. Idempotency và version

    - Các API ghi yêu cầu Idempotency-Key.

    - Với API đã đăng nhập, phạm vi key gồm accountId, operation và resource.

    - Đăng ký công khai dùng phạm vi verificationToken digest và operation.

    - Cùng key, cùng nội dung chuẩn hóa trả status code và body đã lưu.

    - Cùng key, nội dung khác trả 409 IDEMPOTENCY_CONFLICT.

    - Request cùng key đang xử lý transaction cục bộ trả 409 REQUEST_IN_PROGRESS; riêng đăng ký Driver đã có
    operation bền vững trả 202.

    - Kiểm tra quyền hiện tại trước khi replay API đã đăng nhập.

    - Kiểm tra replay hợp lệ trước expectedVersion và điều kiện có thể thay đổi.

    - Response replay là snapshot ban đầu; dùng GET để đọc hiện trạng.

    - Không lưu plaintext mật khẩu hoặc verificationToken trong idempotency.

    - Fingerprint request có bí mật phải dùng cơ chế bảo vệ phù hợp,
      không dùng hash không khóa của mật khẩu để tạo thêm dữ liệu dễ dò.
    - Account, Driver, DriverApplication, Vehicle và Trip có version riêng.

    - Version bắt đầu từ 1 và tăng khi dữ liệu nghiệp vụ thay đổi.

    - GPS không tăng Driver.version hoặc Trip.version.

    - Version không thay thế Idempotency-Key.

    - Kiểm tra điều kiện, khóa dữ liệu và cập nhật phải an toàn khi chạy đồng thời.


    9. Quy tắc chung

    - Request body không nhận trường ngoài schema.

    - Query parameter ngoài hợp đồng trả 400.

    - Chuỗi chỉ có khoảng trắng không hợp lệ với trường bắt buộc có nội dung.

    - Không trim hoặc tự biến đổi mật khẩu.

    - Dùng query tham số hóa để ngăn SQL injection.

    - Nội dung văn bản phải được encode đúng ngữ cảnh khi hiển thị.

    - Không thực thi lý do, ghi chú hoặc tên người dùng như HTML/script.

    - Mọi response sử dụng Cache-Control: no-store.

    - API công khai có rate limit; vượt hạn mức trả 429.

    - Hạn mức healthcheck phải phù hợp tần suất probe.

    - Phân trang keyset, cursor gắn với người gọi, endpoint, bộ lọc và limit.

    - Phân trang không đóng băng trạng thái nghiệp vụ đang thay đổi.


    10. Audit

    - Ghi actor, thao tác, đối tượng, thời điểm, lý do và correlationId.

    - Thay đổi quản trị có dữ liệu trước/sau phù hợp.

    - Đăng ký công khai ghi nguồn đăng ký và liên kết kết quả,
      không giả lập một OPERATOR thực hiện.
    - Replay không tạo thêm thay đổi, audit nghiệp vụ hoặc outbox event.


    Bản xem trước theo SRS 8 MS 1.3 và Micro_Service_Design 1.3, kế thừa API 1.2.0. Chưa sửa repository hoặc
    xác nhận backend hoạt động. Thay đổi cần duyệt: đăng ký 202/tra cứu tiến trình, schema kết quả khóa
    Account/resolve-error, health 12 thành phần và báo cáo ngoài MVP. D04/D05/D07/D08 còn cần hoàn tất trước
    triển khai.

    Dữ liệu Account chung fullName/email/phone do Identity sở hữu; DTO tổng hợp không tạo bản có thể sửa độc
    lập ở Driver. Các trường snapshot hồ sơ là dữ liệu lịch sử có nhãn, không là nguồn cập nhật Account. Xác
    minh Account/Session qua gRPC Identity, không tin header client.
servers:
  - url: /v1
    description: API công khai thông qua API Gateway
security:
  - bearerAuth: []
tags:
  - name: Driver Applications
    description: Đăng ký và xét duyệt hồ sơ tài xế
  - name: Accounts
    description: Quản lý trạng thái tài khoản
  - name: Drivers
    description: Hồ sơ và điều kiện hoạt động của tài xế
  - name: Vehicles
    description: Hồ sơ xe và phân công xe
  - name: Operations
    description: Giám sát chuyến và xử lý sự cố
  - name: Pricing
    description: Giá theo phiên bản
  - name: Payment Monitoring
    description: Theo dõi thanh toán
  - name: Reports
    description: Báo cáo vận hành
  - name: Health
    description: Kiểm tra sức khỏe hệ thống
paths:
  /driver-applications:
    post:
      tags:
        - Driver Applications
      operationId: submitDriverApplication
      summary: Đăng ký tài xế bằng số điện thoại đã xác minh OTP
      security: []
      description: >
        Endpoint công khai nhưng bắt buộc verificationToken hợp lệ từ

        POST /auth/driver-registration/otp/verify.


        Không nhận phone, role, accountStatus, approvalStatus hoặc driverStatus.

        Phone lấy từ bằng chứng xác minh gắn với verificationToken.


        Tạo mới yêu cầu:

        - Token đúng mục đích DRIVER_REGISTRATION.

        - Token còn hạn và chưa được sử dụng.

        - Email, phone và licenseNumber chưa bị sử dụng.

        - Dữ liệu cá nhân và thông tin xe hợp lệ.


        Identity là coordinator, dù đường dẫn thuộc nhóm hồ sơ Driver.

        Trong transaction Identity: khóa/tiêu thụ verificationToken, ghi Account role DRIVER/ACTIVE với cấp
        phát nội bộ chưa hoàn tất, RegistrationOperation, idempotency và dữ liệu phục hồi. Không cấp Session
        khi hồ sơ chưa đủ.

        Gọi Driver qua gRPC cùng operationId/accountId. Driver kiểm tra unique licenseNumber, tạo Driver
        PENDING_APPROVAL/OFFLINE, vehicleId=null, Application SUBMITTED và outbox DRIVER_APPLICATION_SUBMITTED
        trong cab_driver; chưa tạo Vehicle/VehicleAssignment.

        Snapshot hồ sơ được lưu như dữ liệu lịch sử tối thiểu, mã hóa PII; không chuyển
        password/verificationToken cho Driver. Identity chỉ gửi thông tin hồ sơ cần thiết và bằng chứng xác
        minh phone, không gửi bí mật OTP.

        Identity xác nhận hồ sơ đúng Account rồi hoàn tất operation và trả 201; còn xử lý trả 202 cùng
        operationId/Location. Mất phản hồi retry cùng token/key/payload, không tiêu thụ token hoặc tạo hồ sơ
        lần hai. Token hết hạn sau tiếp nhận không hủy operation đã bền vững.

        Nếu lỗi đã xác định trước tạo hồ sơ, thực hiện bù có version/tombstone, ngăn cấp phát đến muộn, vô
        hiệu Account chưa hoàn tất; chỉ kết thúc FAILED khi bù đã rõ. Không xóa/vô hiệu Account khi chưa biết
        Driver đã tạo hồ sơ hay chưa. Không trả thành công một phần.

        Không tự cấp access/refresh token. Sau SUCCEEDED người đăng ký login qua API 01.


        Biển số khai báo chưa phải bằng chứng xe đã được duyệt.

        Quyền sử dụng xe và tính hợp lệ được OPERATOR kiểm tra trước khi duyệt.

        Ràng buộc xe chính thức được kiểm tra lại trong transaction review.


        Replay công khai:

        - Phải gửi lại cùng verificationToken, Idempotency-Key và nội dung.

        - Server xác định token qua digest và bản ghi kết quả đã liên kết.

        - Replay kết quả thành công đã lưu được kiểm tra trước việc token
          đã bị tiêu thụ hoặc hết hạn sau lần đăng ký thành công.
        - Ngoại lệ này chỉ trả lại kết quả cũ, không tạo tài khoản khác.

        - Key mới với token đã sử dụng trả VERIFICATION_TOKEN_USED.

        - Không cho phép chỉ biết Idempotency-Key là đọc được kết quả.


        Các lỗi 409 gồm CONTACT_ALREADY_EXISTS, LICENSE_ALREADY_EXISTS,

        VERIFICATION_TOKEN_USED, IDEMPOTENCY_CONFLICT, REGISTRATION_FAILED hoặc IDEMPOTENCY_KEY_EXPIRED.

        Cùng operation đang chạy trả 202; kết quả FAILED được replay, không tạo operation mới.

        Fingerprint payload dùng HMAC có khóa, không lưu password plaintext; password Account vẫn hash chuyên
        dụng.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitDriverApplicationRequest"
      responses:
        "201":
          description: Đã tạo tài khoản và hồ sơ đăng ký chờ xét duyệt
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              description: Đường dẫn xem hồ sơ sau khi đăng nhập
              schema:
                type: string
                example: /v1/driver-applications/me
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRegistrationResult"
        "202":
          description: Đăng ký đã tiếp nhận bền vững, cấp phát hồ sơ chưa hoàn tất; chưa đăng nhập được.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
              example: /v1/driver-registration-operations/REG_example
              description: Đường dẫn tra cứu cần verification token và idempotency key gốc.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DriverRegistrationOperation"
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - PROCESSING
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ServerError"
      x-owner-service: identity-service
  /driver-applications/me:
    get:
      tags:
        - Driver Applications
      operationId: getMyDriverApplication
      summary: Tài xế xem hồ sơ đăng ký của mình
      description: >
        Chỉ DRIVER có Account ACTIVE và session hợp lệ.

        Cho phép Driver PENDING_APPROVAL, APPROVED hoặc REJECTED.

        Xác định driverId từ tài khoản đăng nhập.

        Không nhận driverId hoặc accountId từ query.

        Trả snapshot hồ sơ đã nộp và kết quả xét duyệt nếu có.

        Không trả verificationToken hoặc dữ liệu OTP.


        Driver MS sở hữu hồ sơ và xe; fullName/email/phone hiện tại lấy Identity qua gRPC, kiểm tra quyền
        trước khi tổng hợp. Không đọc DB khác. Trường bắt buộc không xác minh được trả 503, không dựng dữ liệu
        giả. Snapshot hồ sơ đã nộp nếu có phải được phân biệt dữ liệu Account hiện tại.
      responses:
        "200":
          $ref: "#/components/responses/ApplicationRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ServerError"
      x-owner-service: driver-service
  /operations/driver-applications:
    get:
      tags:
        - Driver Applications
      operationId: listDriverApplications
      summary: Điều hành viên xem danh sách hồ sơ đăng ký
      description: >
        Chỉ OPERATOR.

        Sắp xếp submittedAt giảm dần, sau đó applicationId giảm dần.

        Hồ sơ đã quyết định vẫn được giữ để truy vết.


        Driver MS sở hữu hồ sơ và xe; fullName/email/phone hiện tại lấy Identity qua gRPC, kiểm tra quyền
        trước khi tổng hợp. Không đọc DB khác. Trường bắt buộc không xác minh được trả 503, không dựng dữ liệu
        giả. Snapshot hồ sơ đã nộp nếu có phải được phân biệt dữ liệu Account hiện tại.
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ApplicationStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Danh sách hồ sơ đăng ký
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/ServerError"
      x-owner-service: driver-service
  /operations/driver-applications/{applicationId}:
    get:
      tags:
        - Driver Applications
      operationId: getDriverApplication
      summary: Điều hành viên xem chi tiết hồ sơ đăng ký
      description: >
        Chỉ OPERATOR.

        Dữ liệu snapshot phục vụ xét duyệt, không tự chứng minh

        giấy phép hoặc quyền sử dụng xe đã được kiểm tra.

        Thông tin Account hiện tại có thể khác snapshot hồ sơ đã nộp.


        Driver MS sở hữu hồ sơ và xe; fullName/email/phone hiện tại lấy Identity qua gRPC, kiểm tra quyền
        trước khi tổng hợp. Không đọc DB khác. Trường bắt buộc không xác minh được trả 503, không dựng dữ liệu
        giả. Snapshot hồ sơ đã nộp nếu có phải được phân biệt dữ liệu Account hiện tại.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationRead"
