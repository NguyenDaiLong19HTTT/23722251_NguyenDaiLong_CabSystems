        UNKNOWN và requiresReview=true không đồng nghĩa.
        Sắp xếp createdAt giảm dần, sau đó paymentId giảm dần.

        Trường method thống nhất với Payment API.
        Không trả checkout, dữ liệu thẻ hoặc raw callback.
        Chi tiết Payment và attempt đọc qua Payment API.

        Không cho phép sửa amount, ép SUCCESS hoặc xác nhận CASH thay Driver.
        Reconcile do danh tính dịch vụ nội bộ thực hiện.
        User JWT của OPERATOR không được gọi endpoint reconcile nội bộ.
        Hoàn tiền chưa thuộc phạm vi API này.
      parameters:
