      summary: Phân công, thay hoặc gỡ xe của tài xế
      description: >
        Chỉ OPERATOR.

        Kiểm tra expectedDriverVersion.

        Driver phải OFFLINE và không có Trip hoạt động.


        vehicleId khác null:

