        AVAILABLE:

        - Account ACTIVE, hồ sơ APPROVED.

        - Phân công xe hợp lệ, xe ACTIVE.

        - Không có Trip hoạt động.

        - GPS hợp lệ, không quá 30 giây tính từ recordedAt.

        - Dùng cùng cấu hình và quy tắc GPS với Dispatch.


        OFFLINE:

